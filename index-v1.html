<style>
*{-webkit-tap-highlight-color:transparent;}
::-webkit-scrollbar{width:3px;}
::-webkit-scrollbar-thumb{background:#2A2D3E;border-radius:10px;}
.fade{animation:fadeIn .3s ease forwards;}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.glass{background:rgba(28,30,42,.88);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid rgba(255,255,255,.05);}
.card{background:#1C1E2A;border:1px solid #2A2D3E;border-radius:16px;}
.card-press{transition:all .15s ease;}
.card-press:active{transform:scale(.97);}
.nav-p{color:#3B82F6!important;}
.nav-c{color:#8B5CF6!important;}
.exp-bar{height:6px;border-radius:99px;background:#2A2D3E;overflow:hidden;}
.exp-fill{height:100%;border-radius:99px;background:linear-gradient(90deg,#6366F1,#8B5CF6);transition:width 1s ease;}
.exp-gold{height:100%;border-radius:99px;background:linear-gradient(90deg,#F59E0B,#FBBF24);transition:width 1s ease;}
.ring-track{fill:none;stroke:#2A2D3E;stroke-width:8;}
.ring-fill{fill:none;stroke-width:8;stroke-linecap:round;transform:rotate(-90deg);transform-origin:50% 50%;transition:stroke-dashoffset 1s ease;}
.skeleton{background:linear-gradient(90deg,#1C1E2A 25%,#2A2D3E 50%,#1C1E2A 75%);background-size:200% 100%;animation:sk 1.5s infinite;border-radius:12px;}
@keyframes sk{from{background-position:200% 0}to{background-position:-200% 0}}
.tin{animation:toastIn .3s ease forwards;}
@keyframes toastIn{from{opacity:0;transform:translateX(16px)}to{opacity:1;transform:translateX(0)}}
.float{animation:fl 3s ease-in-out infinite;}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.badge{display:inline-flex;align-items:center;font-size:10px;font-weight:700;padding:2px 8px;border-radius:99px;}
.gold-glow{box-shadow:0 0 32px rgba(245,158,11,.15);}
.blue-glow{box-shadow:0 0 32px rgba(59,130,246,.12);}
.pet-glow{box-shadow:0 0 40px rgba(139,92,246,.2);}
textarea,input,select{background:#13141C!important;border-color:#2A2D3E!important;color:#E5E7EB!important;}
textarea:focus,input:focus,select:focus{border-color:#3B82F6!important;outline:none!important;}
</style>

// ── 工具 ──
function vibrate(p){if(navigator.vibrate)navigator.vibrate(p);}

function showToast(msg,type='blue'){
  const bg={blue:'bg-accent-blue',green:'bg-accent-green',gold:'bg-accent-gold text-dark-900',red:'bg-accent-red',purple:'bg-accent-purple'};
  const el=document.createElement('div');
  el.className=`${bg[type]||bg.blue} text-white px-4 py-3 rounded-2xl shadow-2xl text-sm font-semibold tin flex items-center gap-2`;
  el.innerHTML=msg;
  document.getElementById('toastBox').appendChild(el);
  setTimeout(()=>{el.style.opacity='0';el.style.transition='opacity .3s';setTimeout(()=>el.remove(),300);},3200);
}

function showModal(html){
  document.getElementById('modalBox').innerHTML=html;
  const ov=document.getElementById('modalOv');
  ov.classList.remove('hidden');ov.classList.add('flex');
}
function closeModal(){
  const ov=document.getElementById('modalOv');
  ov.classList.add('hidden');ov.classList.remove('flex');
}
document.getElementById('modalOv').addEventListener('click',e=>{if(e.target===document.getElementById('modalOv'))closeModal();});

function setLoading(v){
  loading=v;
  document.getElementById('skelEl').classList.toggle('hidden',!v);
  document.getElementById('viewEl').classList.toggle('hidden',v);
}

function empty(icon,title,sub,btnTxt,btnFn){
  return `<div class="flex flex-col items-center py-12 text-center">
    <div class="w-16 h-16 rounded-2xl card flex items-center justify-center mb-4">

    ${btnTxt?`<button onclick="${btnFn}" class="bg-accent-blue text-white px-5 py-2 rounded-xl text-sm font-bold transition-all active:scale-95">${btnTxt}</button>`:''}
  </div>`;
}

// ── Firebase ──
async function loadFS(){
  try{
    const fr=db.collection('families').doc(FID);
    const doc=await fr.get();
    if(!doc.exists)await initFSData(fr);
    fr.collection('tasks').onSnapshot(s=>{data.tasks=s.docs.map(d=>({id:d.id,...d.data()}));if(!loading)renderView();});
    fr.collection('redemptions').onSnapshot(s=>{data.redemptions=s.docs.map(d=>({id:d.id,...d.data()}));if(!loading)renderView();});
    const[cs,rs]=await Promise.all([fr.collection('children').get(),fr.collection('rewards').get()]);
    data.children={};cs.forEach(d=>{data.children[d.id]=d.data();});
    data.rewards=rs.docs.map(d=>({id:d.id,...d.data()}));
    if(!data.children[childId])childId=Object.keys(data.children)[0];
    useFS=true;
  }catch(e){
    console.warn('離線模式',e.message);
    showToast('<i class="ph ph-wifi-slash mr-1"></i> 離線模式','gold');
  }
}

async function initFSData(fr){
  const b=db.batch();
  b.set(fr,{created:new Date()});
  Object.entries(data.children).forEach(([id,c])=>b.set(fr.collection('children').doc(id),c));
  data.rewards.forEach(r=>{const{id,...rest}=r;b.set(fr.collection('rewards').doc(id),rest);});
  data.tasks.forEach(t=>{const{id,...rest}=t;b.set(fr.collection('tasks').doc(id),rest);});
  await b.commit();
}

// ── 初始化 ──
async function init(){
  document.getElementById('hDate').textContent=new Date().toLocaleDateString('zh-TW',{month:'short',day:'numeric',weekday:'short'});
  updateUserUI();buildNav();
  setLoading(true);
  await loadFS();
  setLoading(false);
  renderView();
  initSwipe();
  initLiff();
}

function initSwipe(){
  const el=document.getElementById('mainEl');
  let sx=0;
  el.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;},{passive:true});
  el.addEventListener('touchend',e=>{
    const d=sx-e.changedTouches[0].clientX;
    const vs=identity==='parent'?['home','tasks','rewards','notify']:['home','tasks','store','history'];
    const i=vs.indexOf(view);
    if(d>70&&i<vs.length-1){vibrate(5);switchView(vs[i+1]);}
    if(d<-70&&i>0){vibrate(5);switchView(vs[i-1]);}
  },{passive:true});
}

async function initLiff(){
  try{
    await liff.init({liffId:'2009808286-3qfR7gLt'});
    if(liff.isLoggedIn()){const p=await liff.getProfile();document.getElementById('uAvatar').src=p.pictureUrl;}
  }catch(e){console.log('非LINE環境');}
}

function buildNav(){
  const ns=identity==='parent'?NAV_PARENT:NAV_CHILD;
  const ac=identity==='parent'?'nav-p':'nav-c';
  document.getElementById('sideNav').innerHTML=ns.map(n=>`
    <button onclick="vibrate(5);switchView('${n.id}')" id="side-${n.id}"
      class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-gray-400 hover:text-white hover:bg-dark-800 transition-all text-sm font-medium ${n.id===view?ac:''}">
      <i class="${n.icon} text-lg"></i>${n.label}
    </button>`).join('');
  document.getElementById('botNav').innerHTML=ns.map(n=>`
    <button onclick="vibrate(8);switchView('${n.id}')" id="bot-${n.id}"
      class="flex flex-col items-center gap-1 text-gray-500 px-2 py-2 rounded-xl transition-all active:scale-90 ${n.id===view?ac:''}">
      <i class="${n.icon} text-2xl"></i><span class="text-[10px] font-bold">${n.label}</span>
    </button>`).join('')+`
    <button onclick="vibrate([5,30,5]);toggleIdentity()" class="flex flex-col items-center gap-1 text-gray-500 px-2 py-2 rounded-xl transition-all active:scale-90">
      <i class="ph-fill ph-user-switch text-2xl"></i><span class="text-[10px] font-bold">切換</span>
    </button>`;
}

function updateNavActive(){
  const ns=identity==='parent'?NAV_PARENT:NAV_CHILD;
  const ac=identity==='parent'?'nav-p':'nav-c';
  ns.forEach(n=>{
    ['side-','bot-'].forEach(p=>{
      const el=document.getElementById(p+n.id);
      if(!el)return;
      el.classList.remove('nav-p','nav-c');
      if(n.id===view)el.classList.add(ac);
    });
  });
}

function switchView(v){

function renderView(){
  const el=document.getElementById('viewEl');
  const ht=document.getElementById('hTitle');
  const hr=document.getElementById('hRight');

    const titles={home:'首頁總覽 ⚓',tasks:'任務管理 📋',rewards:'獎勵中心 🎁',notify:'貼心提醒 🔔'};
    ht.textContent=titles[view]||'Family OS';
    hr.classList.add('hidden');
    el.innerHTML=view==='home'?parentHome():view==='tasks'?parentTasks():view==='rewards'?parentRewards():parentNotify();
  }else{
    const c=data.children[childId];
    const titles={home:`嗨，${c?.name||'冒險家'} 🚀`,tasks:'我的任務 ✅',store:'貝殼幣商城 🐚',history:'歷程紀錄 📖'};
    ht.textContent=titles[view]||'冒險島';

    hr.innerHTML=`<div class="flex items-center gap-2">
      <span class="card px-3 py-1.5 text-accent-gold font-bold text-sm flex items-center gap-1 gold-glow">🐚 ${c?.points||0}</span>
      ${(c?.streak||0)>0?`<span class="card px-2 py-1.5 flex items-center gap-1"><span style="display:inline-block;animation:fl 0.8s ease-in-out infinite alternate">🔥</span><span class="text-orange-400 font-bold text-xs">${c.streak}</span></span>`:''}
    </div>`;
    el.innerHTML=view==='home'?childHome():view==='tasks'?childTasks():view==='store'?childStore():childHistory();

}

  const events=[
    ...done.map(t=>({type:'task',title:t.title,pts:'+'+t.pts,icon:'ph-check-circle',color:'text-accent-green',bg:'bg-accent-green/10',sub:'任務完成・獲得貝殼幣',cat:t.cat})),

      <p class="text-[11px] text-gray-500 font-bold uppercase tracking-widest mb-3">我的成就</p>
      <div class="grid grid-cols-3 gap-2">

        <div class="rounded-xl p-3 text-center ${a.unlocked?'bg-dark-700':'bg-dark-900 opacity-40'}">

    <!-- 活動紀錄 -->
    <div>
      <p class="text-[11px] text-gray-500 font-bold uppercase tracking-widest mb-3">活動紀錄</p>
      ${events.length>0?`<div class="space-y-2">${events.map(e=>`
        <div class="card p-4 flex items-center gap-3">

// ════════════════════════════════
// Actions
// ════════════════════════════════
async function addTask(){
  const title=document.getElementById('nTitle')?.value.trim();
  const child=document.getElementById('nChild')?.value;
  const cat=document.getElementById('nCat')?.value;
  const pts=parseInt(document.getElementById('nPts')?.value)||10;
  if(!title){showToast('請輸入任務名稱','gold');return;}
  const nt={child,title,pts,cat,status:'todo'};
  if(useFS){const ref=await db.collection('families').doc(FID).collection('tasks').add({...nt,createdAt:firebase.firestore.FieldValue.serverTimestamp()});nt.id=ref.id;}
  else{nt.id='t'+Date.now();data.tasks.push(nt);}
  document.getElementById('nTitle').value='';
  renderView();showToast('<i class="ph-fill ph-plus-circle mr-1"></i> 任務已新增！','blue');
}

async function submitTask(id){
  const t=data.tasks.find(t=>t.id===id);if(!t)return;
  t.status='pending';
  if(useFS)await db.collection('families').doc(FID).collection('tasks').doc(id).update({status:'pending'});
  renderView();showToast('<i class="ph-fill ph-paper-plane-right mr-1"></i> 已送出！等待船長審核','blue');
}

async function approveTask(id){
  const t=data.tasks.find(t=>t.id===id);if(!t)return;
  const c=data.children[t.child];if(!c)return;
  c.points+=t.pts;c.exp=Math.min(100,(c.exp||0)+8);c.streak=(c.streak||0)+1;
  if(c.pet){c.pet.petExp=Math.min(c.pet.maxExp,(c.pet.petExp||0)+5);checkPetEvo(t.child);}
  t.status='approved';
  if(useFS){const b=db.batch();const fr=db.collection('families').doc(FID);b.update(fr.collection('tasks').doc(id),{status:'approved'});b.update(fr.collection('children').doc(t.child),{points:c.points,exp:c.exp,streak:c.streak,'pet.petExp':c.pet?.petExp});await b.commit();}
  renderView();showToast('<i class="ph-fill ph-check-circle mr-1"></i> 核准！貝殼幣已發放 🐚','green');
}

async function rejectTask(id){
  const t=data.tasks.find(t=>t.id===id);if(!t)return;
  t.status='todo';
  if(useFS)await db.collection('families').doc(FID).collection('tasks').doc(id).update({status:'todo'});
  renderView();showToast('<i class="ph ph-x-circle mr-1"></i> 已退回','red');
}

function checkPetEvo(cid){
  const c=data.children[cid];if(!c?.pet)return;
  const p=c.pet;const curr=PET_STAGES[p.stage];
  if(curr&&p.petExp>=curr.maxExp&&p.stage<PET_STAGES.length-1){
    p.stage+=1;p.petExp=0;p.maxExp=PET_STAGES[p.stage].maxExp;
    const ns=PET_STAGES[p.stage];
    setTimeout(()=>showToast(`<i class="ph-fill ph-sparkle mr-1"></i> ${p.name} 進化成 ${ns.name} ${ns.emoji}！`,'purple'),500);
  }
}

async function redeemReward(rid){
  const r=data.rewards.find(r=>r.id===rid);
  const c=data.children[childId];
  if(!r||r.stock<=0){showToast('此獎勵已售完','red');return;}
  if(c.points<r.pts){showToast('貝殼幣不足 🐚','red');return;}
  c.points-=r.pts;r.stock-=1;
  const nr={childId,childName:c.name,rewardId:rid,title:r.title,pts:r.pts,status:'pending',createdAt:new Date().toISOString()};
  if(useFS){const b=db.batch();const fr=db.collection('families').doc(FID);const ref=fr.collection('redemptions').doc();nr.id=ref.id;b.set(ref,nr);b.update(fr.collection('children').doc(childId),{points:c.points});b.update(fr.collection('rewards').doc(rid),{stock:r.stock});await b.commit();}
  else{nr.id='red'+Date.now();data.redemptions.push(nr);}
  renderView();showToast('<i class="ph-fill ph-gift mr-1"></i> 兌換申請已送出！等待船長確認 🚀','blue');
}

async function approveRed(id){
  const r=data.redemptions.find(r=>r.id===id);if(!r)return;
  r.status='approved';
  if(useFS)await db.collection('families').doc(FID).collection('redemptions').doc(id).update({status:'approved'});
  renderView();showToast('<i class="ph-fill ph-check-circle mr-1"></i> 兌換已核准！','green');
}

async function rejectRed(id){
  const r=data.redemptions.find(r=>r.id===id);if(!r)return;
  const c=data.children[r.childId];if(c)c.points+=r.pts;
  r.status='rejected';
  if(useFS){const b=db.batch();const fr=db.collection('families').doc(FID);b.update(fr.collection('redemptions').doc(id),{status:'rejected'});if(c)b.update(fr.collection('children').doc(r.childId),{points:c.points});await b.commit();}
  renderView();showToast('<i class="ph ph-x-circle mr-1"></i> 已駁回並退還貝殼幣','red');
}

async function restock(rid){
  const r=data.rewards.find(r=>r.id===rid);if(!r)return;
  r.stock+=1;
  if(useFS)await db.collection('families').doc(FID).collection('rewards').doc(rid).update({stock:r.stock});
  renderView();showToast(`<i class="ph-fill ph-plus-circle mr-1"></i> ${r.title} 補貨成功！`,'green');
}

function addNotice(){
  const text=document.getElementById('noticeText')?.value.trim();
  const emoji=document.getElementById('sEmoji')?.value||'💡';
  if(!text){showToast('請輸入提醒內容','gold');return;}
  data.notices.unshift({id:'n'+Date.now(),emoji,text});
  renderView();showToast('<i class="ph-fill ph-bell-ringing mr-1"></i> 提醒已新增！','green');
}

function deleteNotice(id){
  data.notices=data.notices.filter(n=>n.id!==id);
  renderView();showToast('已刪除提醒','red');
}

function showAddRewardModal(){
  showModal(`
    <h3 class="text-base font-bold text-white mb-4">新增獎勵</h3>
    <div class="space-y-3">
      <input id="mrTitle" type="text" placeholder="獎勵名稱" class="w-full border rounded-xl px-4 py-3 text-sm">

      </div>

      </div>

async function addReward(){
  const title=document.getElementById('mrTitle')?.value.trim();
  const pts=parseInt(document.getElementById('mrPts')?.value)||30;
  const stock=parseInt(document.getElementById('mrStock')?.value)||5;
  const cat=document.getElementById('mrCat')?.value;
  if(!title){showToast('請輸入獎勵名稱','gold');return;}
  const nr={title,pts,stock,cat,icon:'ph-gift'};
  if(useFS){const ref=await db.collection('families').doc(FID).collection('rewards').add(nr);nr.id=ref.id;}
  else{nr.id='r'+Date.now();}
  data.rewards.push(nr);
  closeModal();renderView();showToast('<i class="ph-fill ph-gift mr-1"></i> 獎勵已新增！','green');
}

// ── 啟動 ──
init();
</script>
