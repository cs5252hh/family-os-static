const fsStats = { reads: 0, writes: 0, snapshots: 0, cacheHits: 0 };
function fsLog(type, desc='') {
  fsStats[type] = (fsStats[type] || 0) + 1;
  console.log(`[Firestore] ${type}: ${desc} | 累計 reads=${fsStats.reads} writes=${fsStats.writes} snapshots=${fsStats.snapshots} cacheHits=${fsStats.cacheHits}`);
}

// ══════════════════════════════════════

const CACHE_TTL = 10 * 60 * 1000; // 10 min
function cacheGet(key, maxAgeMs = CACHE_TTL) {
  try {
    const raw = localStorage.getItem('fos_' + key);
    if (!raw) return null;
    const { ts, data } = JSON.parse(raw);
    if (Date.now() - ts > maxAgeMs) { localStorage.removeItem('fos_' + key); return null; }
    fsLog('cacheHits', key);
    return data;
  } catch(e) { return null; }
}
function cacheSet(key, data) {
  try { localStorage.setItem('fos_' + key, JSON.stringify({ ts: Date.now(), data })); } catch(e) {}
}
function cacheClear(key) {
  try { localStorage.removeItem('fos_' + key); } catch(e) {}
}
function cacheClearFamily() {
  try {
    Object.keys(localStorage).filter(k => k.startsWith('fos_')).forEach(k => localStorage.removeItem(k));
  } catch(e) {}
}

function showToast(msg, type='blue'){
  const bg = {blue:'bg-accent-blue',green:'bg-accent-green',gold:'bg-accent-gold text-dark-900',red:'bg-accent-red',purple:'bg-accent-purple'};
  const el = document.createElement('div');
  el.className = `${bg[type]||bg.blue} text-white px-4 py-3 rounded-2xl shadow-2xl text-sm font-semibold tin flex items-center gap-2`;
  el.innerHTML = msg;
  document.getElementById('toastBox').appendChild(el);
  setTimeout(()=>{ el.style.opacity='0'; el.style.transition='opacity .3s'; setTimeout(()=>el.remove(),300); },3200);
}

function getPetStage(petEXP){
  return PET_STAGES.find(s => petEXP >= s.minEXP && petEXP < s.maxEXP) || PET_STAGES[0];

function getMemberName(userId){
  if(Array.isArray(userId)) return userId.map(id => familyData.members[id]?.name || '未知').join('、');

}

function taskIsFor(task, userId){
  if(Array.isArray(task.assignedTo)) return task.assignedTo.includes(userId);
  return task.assignedTo === userId;
}

async function initLiff(){
  // Check if arriving from kid.html with ?mode=kid
  const params = new URLSearchParams(window.location.search);
  if(params.get('mode') === 'kid'){
    const kidId = sessionStorage.getItem('currentKidId');
    if(kidId){
      try {
        updateLoadingText('載入小冒險家資料...');
        liffUserId = kidId;
        await checkUserSetup();
        return;
      } catch(e){
        console.error('Kid mode login failed:', e);
        window.location.href = 'kid.html';
        return;
      }
    } else {
      // No session — redirect back to kid.html
      window.location.href = 'kid.html';
      return;
    }
  }

  try {
    updateLoadingText('連接 LINE...');
    await liff.init({ liffId: '2009808286-3qfR7gLt' });
    if(!liff.isLoggedIn()){
      if(liff.isInClient()){ liff.login(); return; }
      showDemoModeOption(); return;
    }
    const profile = await liff.getProfile();
    liffUserId = profile.userId;
    updateLoadingText('檢查用戶資料...');
    await checkUserSetup();
  } catch(e){
    console.error('LIFF 初始化失敗:', e);
    showDemoModeOption();
  }
}

    await checkUserSetup();
  } catch(e){
    console.error('Google 登入失敗:', e);
    if(e.code === 'auth/popup-closed-by-user') return;

async function checkUserSetup(){
  try {
    // [P2] 嘗試從快取讀取
    const cachedUser = cacheGet('user_' + liffUserId);
    if (cachedUser) {
      currentUser = cachedUser;
      userRole = currentUser.role;
      updateLoadingText('載入家庭資料...');
      const cachedFamily = cacheGet('family_' + currentUser.familyId);
      if (cachedFamily) {
        userFamily = cachedFamily;
        updateLoadingText('準備就緒！');
        await initMainApp();
        // 背景更新快取
        refreshUserAndFamily();
        return;
      }
    }

    // [P5] 一次取得 user 文檔
    fsLog('reads', 'users/' + liffUserId);
    const userDoc = await db.collection('users').doc(liffUserId).get();
    if(userDoc.exists){
      currentUser = { id: liffUserId, ...userDoc.data() };
      userRole = currentUser.role;
      cacheSet('user_' + liffUserId, currentUser);
      updateLoadingText('載入家庭資料...');

      fsLog('reads', 'families/' + currentUser.familyId);
      const familyDoc = await db.collection('families').doc(currentUser.familyId).get();
      if(familyDoc.exists){
        userFamily = { id: familyDoc.id, ...familyDoc.data() };
        cacheSet('family_' + userFamily.id, userFamily);
        updateLoadingText('準備就緒！');
        await initMainApp();
      } else { throw new Error('家庭不存在'); }
    } else { showSetupScreen(); }
  } catch(e){
    console.error('用戶設定檢查失敗:', e);
    showSetupScreen();
  }
}

// [P2] 背景更新快取（不阻塞 UI）
async function refreshUserAndFamily(){
  try {
    fsLog('reads', 'bg-refresh user+family');
    const [uDoc, fDoc] = await Promise.all([
      db.collection('users').doc(liffUserId).get(),
      db.collection('families').doc(currentUser.familyId).get()
    ]);
    if(uDoc.exists){ currentUser = { id: liffUserId, ...uDoc.data() }; cacheSet('user_' + liffUserId, currentUser); }
    if(fDoc.exists){ userFamily = { id: fDoc.id, ...fDoc.data() }; cacheSet('family_' + userFamily.id, userFamily); }
  } catch(e){ console.warn('背景更新失敗:', e); }
}

function generateInviteCode(){
  const chars = 'ABCDEFGHIJKLMNPQRSTUVWXYZ123456789';
  let r = '';
  for(let i=0;i<6;i++) r += chars.charAt(Math.floor(Math.random()*chars.length));
  return r;
}

async function createFamily(){
  const familyName = document.getElementById('familyNameInput').value.trim();
  const captainName = document.getElementById('captainNameInput').value.trim();
  if(!familyName || !captainName){ alert('請填寫所有欄位'); return; }
  try {
    const inviteCode = generateInviteCode();
    const familyId = db.collection('families').doc().id;
    fsLog('writes', 'createFamily: family+user+reminder');
    await db.collection('families').doc(familyId).set({
      name: familyName, inviteCode, members: [liffUserId],
      createdAt: firebase.firestore.FieldValue.serverTimestamp(),
      updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
      settings: { defaultTaskReward: 5, petEXPPerTask: 5, timezone: 'Asia/Taipei' },
      stats: { totalTasksCompleted: 0, totalCoinsEarned: 0, activeDays: 0 }
    });
    await db.collection('users').doc(liffUserId).set({
      familyId, role: 'captain', name: captainName, coins: 0, petEXP: 0, streak: 0,
      createdAt: firebase.firestore.FieldValue.serverTimestamp(),
      lastActiveAt: firebase.firestore.FieldValue.serverTimestamp()
    });
    await db.collection('families').doc(familyId).collection('reminders').add({
      emoji: '👋', message: '歡迎來到我們的冒險島！', isActive: true,
      createdAt: firebase.firestore.FieldValue.serverTimestamp(), createdBy: liffUserId
    });
    currentUser = { id: liffUserId, familyId, role: 'captain', name: captainName, coins: 0, petEXP: 0, streak: 0 };
    userRole = 'captain';
    userFamily = { id: familyId, name: familyName, inviteCode, members: [liffUserId] };
    await initMainApp();
  } catch(e){ console.error('建立家庭失敗:', e); alert('建立家庭失敗，請重試'); }
}

async function joinFamily(){
  const inviteCode = document.getElementById('inviteCodeInput').value.trim().toUpperCase();
  const kidName = document.getElementById('kidNameInput').value.trim();
  if(!inviteCode || !kidName){ alert('請填寫所有欄位'); return; }
  if(inviteCode.length !== 6){ alert('邀請碼必須是 6 位數'); return; }
  try {
    fsLog('reads', 'joinFamily: query by inviteCode');
    const q = await db.collection('families').where('inviteCode','==',inviteCode).limit(1).get();
    if(q.empty){ alert('邀請碼不存在，請確認後重試'); return; }
    const familyDoc = q.docs[0];
    const familyId = familyDoc.id;
    fsLog('writes', 'joinFamily: update family + set user');
    await db.collection('families').doc(familyId).update({
      members: firebase.firestore.FieldValue.arrayUnion(liffUserId),
      updatedAt: firebase.firestore.FieldValue.serverTimestamp()
    });
    await db.collection('users').doc(liffUserId).set({
      familyId, role: 'kid', name: kidName, coins: 0, petEXP: 0, streak: 0,
      createdAt: firebase.firestore.FieldValue.serverTimestamp(),
      lastActiveAt: firebase.firestore.FieldValue.serverTimestamp()
    });
    currentUser = { id: liffUserId, familyId, role: 'kid', name: kidName, coins: 0, petEXP: 0, streak: 0 };
    userRole = 'kid';
    userFamily = { id: familyId, ...familyDoc.data(), members: [...(familyDoc.data().members||[]), liffUserId] };
    await initMainApp();
  } catch(e){ console.error('加入家庭失敗:', e); alert('加入家庭失敗，請重試'); }
}

async function initMainApp(){
  document.getElementById('loadingScreen').classList.add('hidden');
  document.getElementById('setupScreen').classList.add('hidden');
  document.getElementById('mainApp').classList.remove('hidden');

  document.getElementById('hDate').textContent = new Date().toLocaleDateString('zh-TW',{month:'short',day:'numeric',weekday:'short'});

  if(userFamily){
    document.getElementById('sidebarFamilyName').textContent = userFamily.name || 'ADVENTUREKIDS';
    document.getElementById('sidebarInviteCode').textContent = userFamily.inviteCode || '------';
  }

  await loadMembers();
  buildNav();
  setupCoreListeners();      // [P1] 只監聽 user + family 文檔
  currentPage = 'home';
  setupPageListeners('home'); // [P1] 按頁面監聽
}

async function loadMembers(){
  if(!userFamily?.members) return;
  // [P5] 並行載入所有成員，使用快取
  const promises = userFamily.members.map(async (memberId) => {
    const cached = cacheGet('user_' + memberId);
    if (cached) { familyData.members[memberId] = cached; return; }
    try {
      fsLog('reads', 'users/' + memberId);
      const doc = await db.collection('users').doc(memberId).get();
      if(doc.exists){
        const data = { id: memberId, ...doc.data() };
        familyData.members[memberId] = data;
        cacheSet('user_' + memberId, data);
      }
    } catch(e){ console.warn('無法載入成員:', memberId); }
  });
  await Promise.all(promises);
}

function setupCoreListeners(){
  // 核心監聽：只監聽 user 和 family 文檔（2 個 listener）
  coreListeners.forEach(fn => fn());
  coreListeners = [];
  const famRef = db.collection('families').doc(userFamily.id);

  fsLog('snapshots', 'core: users/' + liffUserId);
  coreListeners.push(db.collection('users').doc(liffUserId).onSnapshot(doc => {
    if(doc.exists){
      currentUser = { id: liffUserId, ...doc.data() };
      familyData.members[liffUserId] = currentUser;
      cacheSet('user_' + liffUserId, currentUser);
      renderPage();
    }
  }));

  fsLog('snapshots', 'core: families/' + userFamily.id);
  coreListeners.push(famRef.onSnapshot(doc => {
    if(doc.exists){
      userFamily = { id: doc.id, ...doc.data() };
      cacheSet('family_' + userFamily.id, userFamily);
      document.getElementById('sidebarFamilyName').textContent = userFamily.name;
      document.getElementById('sidebarInviteCode').textContent = userFamily.inviteCode;
    }
  }));
}

        familyData.rewards = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        renderPage();
      }));
    }
    if(page === 'reminders'){
      fsLog('snapshots', 'page: reminders');
      activeListeners.push(famRef.collection('reminders').onSnapshot(snap => {
        familyData.reminders = snap.docs.map(d => ({ id: d.id, ...d.data() }));

      }));
    }

      fsLog('snapshots', 'page: users (kids)');

        renderPage();
      }));

        familyData.tasks = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        renderPage();
      }));
    }
    if(page === 'home'){
      // 首頁需要 reminders（船長的話輪播）— 用 .get() 一次讀取全部啟用中的
      fsLog('reads', 'reminders (one-time for kid home)');
      famRef.collection('reminders').where('isActive','==',true).orderBy('createdAt','desc').get().then(snap => {
        familyData.reminders = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        renderPage();
      });
      // Kid home Tab 2 needs rewards + redemptions
      const cachedR = cacheGet('rewards_' + userFamily.id);
      if(cachedR){ familyData.rewards = cachedR; renderPage(); }
      fsLog('reads', 'rewards (for kid home rewards tab)');
      famRef.collection('rewards').get().then(snap => {
        familyData.rewards = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        cacheSet('rewards_' + userFamily.id, familyData.rewards);
        renderPage();
      });
      fsLog('snapshots', 'page: redemptions (kid home)');
      activeListeners.push(famRef.collection('redemptions').where('userId','==',liffUserId).onSnapshot(snap => {
        familyData.redemptions = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        renderPage();
      }));
    }
    if(page === 'store'){
      // [P2] 獎勵用快取 + 一次讀取
      const cachedRewards = cacheGet('rewards_' + userFamily.id);
      if(cachedRewards){
        familyData.rewards = cachedRewards;
        renderPage();
      }
      fsLog('reads', 'rewards (one-time for store)');
      famRef.collection('rewards').get().then(snap => {
        familyData.rewards = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        cacheSet('rewards_' + userFamily.id, familyData.rewards);
        renderPage();
      });
    }
    if(page === 'history'){
      // [P3] 歷史頁 — 用 .get() + limit 分頁
      loadHistoryPage(true);
    }
  }
}

// [P3] 歷史資料分頁載入
async function loadHistoryPage(reset = false){
  if(reset){ historyLastDoc = null; familyData.redemptions = []; }
  const famRef = db.collection('families').doc(userFamily.id);
  try {
    // 載入已完成任務（最近 20 筆）
    fsLog('reads', 'tasks completed (paginated)');
    let tQuery = famRef.collection('tasks')
      .where('assignedTo','==',liffUserId)
      .where('status','==','completed')
      .orderBy('completedAt','desc')
      .limit(20);
    const tSnap = await tQuery.get();
    const completedTasks = tSnap.docs.map(d => ({ id: d.id, ...d.data() }));

    // 合併到 familyData.tasks（保留其他狀態的任務）
    const nonCompleted = familyData.tasks.filter(t => t.status !== 'completed' || !taskIsFor(t,liffUserId));
    familyData.tasks = [...nonCompleted, ...completedTasks];

    // 載入兌換紀錄（最近 20 筆）
    fsLog('reads', 'redemptions (paginated)');
    let rQuery = famRef.collection('redemptions')
      .where('userId','==',liffUserId)
      .orderBy('appliedAt','desc')
      .limit(20);
    if(historyLastDoc) rQuery = rQuery.startAfter(historyLastDoc);
    const rSnap = await rQuery.get();
    if(!rSnap.empty) historyLastDoc = rSnap.docs[rSnap.docs.length - 1];
    const newRedemptions = rSnap.docs.map(d => ({ id: d.id, ...d.data() }));
    familyData.redemptions = reset ? newRedemptions : [...familyData.redemptions, ...newRedemptions];
    renderPage();
  } catch(e){ console.error('載入歷程失敗:', e); }
}

function stopReminderCarousel(){
  if(reminderInterval){ clearInterval(reminderInterval); reminderInterval=null; }
}
function startReminderCarousel(){
  stopReminderCarousel();
  const rems = familyData.reminders.filter(r => r.isActive !== false);
  if(rems.length < 2) return; // No carousel needed for 0-1 items
  reminderInterval = setInterval(() => {
    const emojiEl = document.getElementById('reminderEmoji');
    const msgEl = document.getElementById('reminderMsg');
    if(!emojiEl || !msgEl){ stopReminderCarousel(); return; }
    // Fade out
    emojiEl.style.opacity = '0'; msgEl.style.opacity = '0';
    setTimeout(() => {
      currentReminderIndex = (currentReminderIndex + 1) % rems.length;
      const cur = rems[currentReminderIndex];
      emojiEl.textContent = cur.emoji || '💡';
      msgEl.textContent = cur.message || '';
      // Update dots
      document.querySelectorAll('[data-reminder-dot]').forEach((d,i) => {
        d.classList.toggle('bg-accent-blue', i===currentReminderIndex);
        d.classList.toggle('bg-accent-blue/30', i!==currentReminderIndex);
      });
      // Fade in
      emojiEl.style.opacity = '1'; msgEl.style.opacity = '1';
    }, 300);
  }, 6000);
}

function getMonthLabel(y,m){ return `${y} 年 ${m+1} 月`; }
function isThisMonth(y,m){ const n=new Date(); return y===n.getFullYear() && m===n.getMonth(); }
function getMonthTasks(y,m){
  return familyData.tasks.filter(t => {
    if(t.status!=='completed') return false;
    const ts = t.completedAt?.seconds ? t.completedAt.seconds*1000 : (t.createdAt?.seconds ? t.createdAt.seconds*1000 : 0);
    if(!ts) return false;
    const d = new Date(ts);
    return d.getFullYear()===y && d.getMonth()===m;
  });
}
function getMonthRedemptions(y,m){
  return familyData.redemptions.filter(r => {
    const ts = r.createdAt?.seconds ? r.createdAt.seconds*1000 : 0;
    if(!ts) return false;
    const d = new Date(ts);
    return d.getFullYear()===y && d.getMonth()===m;
  });
}

function todayTimeline(){
  const today = new Date(); today.setHours(0,0,0,0);
  const todayTasks = familyData.tasks.filter(t => {
    if(t.status!=='completed') return false;
    const ts = t.completedAt?.seconds||t.createdAt?.seconds||0;
    return ts*1000 >= today.getTime();
  }).sort((a,b) => (b.completedAt?.seconds||b.createdAt?.seconds||0) - (a.completedAt?.seconds||a.createdAt?.seconds||0));
  if(todayTasks.length===0) return '';
  return `<div>

function timeAgo(ts){
  if(!ts) return '';
  const now = Date.now();
  const t = ts.seconds ? ts.seconds*1000 : ts;
  const diff = now - t;
  const mins = Math.floor(diff/60000);
  if(mins<1) return '剛剛';
  if(mins<60) return mins+' 分鐘前';
  const hrs = Math.floor(mins/60);
  if(hrs<24) return hrs+' 小時前';
  const days = Math.floor(hrs/24);
  if(days<30) return days+' 天前';
  const months = Math.floor(days/30);
  return months+' 個月前';
}

function kidAchievementsTab(){
  const coins = currentUser?.coins || 0;
  const petEXP = currentUser?.petEXP || 0;
  const streak = currentUser?.streak || 0;
  const done = familyData.tasks.filter(t => taskIsFor(t,liffUserId) && t.status==='completed');
  const totalCoins = done.reduce((s,t)=>s+(t.reward||0),0);
  const myRedemptions = familyData.redemptions.filter(r => r.userId===liffUserId && r.status==='approved');

  // Achievements progress
  const achProgress = ACHIEVEMENTS.map(a => {
    let current = 0;
    if(a.type==='task_count') current = done.length;
    else if(a.type==='streak') current = streak;
    else if(a.type==='coins') current = coins;
    else if(a.type==='pet_level') current = petEXP;
    const earned = current >= a.threshold;
    const pct = Math.min(100, Math.round((current/a.threshold)*100));
    return {...a, current, earned, pct};
  });
  const earnedList = achProgress.filter(a => a.earned);
  const lockedList = achProgress.filter(a => !a.earned);

  // Pet evolution timeline
  const allStages = PET_STAGES.map(s => ({...s, reached: petEXP >= s.minEXP}));

  return `<div class="tab-content space-y-5">
    <!-- 累積統計 -->

          <p class="text-[10px] text-gray-500">兌換次數</p>
        </div>
        <div class="card p-3 text-center">
          <i class="ph-fill ph-fire text-orange-400 text-lg mb-1"></i>
          <p class="text-2xl font-bold text-white">${streak}</p>
          <p class="text-[10px] text-gray-500">連續天數</p>
        </div>

    <!-- 成就牆 — 已解鎖 -->
    <div>
      <p class="text-[11px] text-gray-500 font-bold uppercase tracking-widest mb-3"><i class="ph ph-medal mr-1"></i>成就牆（${earnedList.length}/${achProgress.length}）</p>
      ${earnedList.length>0?`<div class="space-y-2 mb-3">${earnedList.map(a => `
        <div class="card p-3 flex items-center gap-3" style="border-color:rgba(245,158,11,.15)">
          <div class="w-11 h-11 rounded-xl bg-accent-gold/15 flex items-center justify-center shrink-0">

const KID_AVATARS = ['🧒','👦','👧','🧒','👨','👩','👶','🦸','🧚','🦊','🐱','🐶'];
const KID_CODE_CHARS = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';

async function generateKidCode(){
  for(let attempt=0; attempt<10; attempt++){
    let code = 'KID-';
    for(let i=0; i<6; i++) code += KID_CODE_CHARS[Math.floor(Math.random()*KID_CODE_CHARS.length)];
    const snap = await db.collection('users').where('kidCode','==',code).limit(1).get();
    if(snap.empty) return code;
  }
  return 'KID-'+Date.now().toString(36).toUpperCase().slice(-6);
}

let addKidPinOn = false;
function togglePinInput(){
  addKidPinOn = !addKidPinOn;
  const sec = document.getElementById('akPinSection');

  if(addKidPinOn){
    sec.classList.remove('hidden');

async function createKid(){
  const name = (document.getElementById('akName')?.value||'').trim();
  const avatar = document.getElementById('akAvatar')?.value || '🧒';
  if(!name){ showToast('請輸入名字','gold'); return; }
  let pin = null;
  if(addKidPinOn){
    const p1=document.getElementById('akPin1')?.value||'';
    const p2=document.getElementById('akPin2')?.value||'';
    const p3=document.getElementById('akPin3')?.value||'';
    const p4=document.getElementById('akPin4')?.value||'';
    pin = p1+p2+p3+p4;
    if(pin.length!==4){ showToast('請輸入完整 4 位 PIN','gold'); return; }
  }
  try {
    showToast('建立中...','blue');
    const kidCode = await generateKidCode();
    const kidId = 'kid_' + Math.random().toString(36).slice(2,8);
    const kidData = {
      userId: kidId, kidCode: kidCode, pin: pin, hasPin: !!pin,
      name: name, avatar: avatar, familyId: userFamily.id, role: 'kid',
      createdBy: liffUserId, createdAt: firebase.firestore.FieldValue.serverTimestamp(),
      coins: 0, petEXP: 0, streak: 0
    };
    await db.collection('users').doc(kidId).set(kidData);
    await db.collection('families').doc(userFamily.id).update({
      members: firebase.firestore.FieldValue.arrayUnion(kidId)
    });
    cacheClear('family_'+userFamily.id);
    addKidPinOn = false;
    showKidCreatedModal(name, avatar, kidCode, pin);
    showToast('小冒險家建立成功！','green');
  } catch(e){ console.error('createKid error:', e); showToast('建立失敗：'+e.message,'red'); }
}

function checkDeleteConfirm(name){
  const val = (document.getElementById('dkConfirm')?.value||'').trim();
  const btn = document.getElementById('dkDeleteBtn');
  if(!btn) return;
  if(val===name){
    btn.disabled = false;
    btn.classList.remove('opacity-50','cursor-not-allowed','bg-red-500/30');
    btn.classList.add('bg-red-500','active:scale-95','hover:brightness-110');
  } else {
    btn.disabled = true;
    btn.classList.add('opacity-50','cursor-not-allowed','bg-red-500/30');
    btn.classList.remove('bg-red-500','active:scale-95','hover:brightness-110');
  }
}

async function confirmDeleteKid(kidId){
  try {
    showToast('刪除中...','blue');
    const famRef = db.collection('families').doc(userFamily.id);
    // Delete related tasks
    const taskSnap = await famRef.collection('tasks').where('assignedTo','==',kidId).get();
    const batch1 = db.batch();
    taskSnap.forEach(d => batch1.delete(d.ref));
    if(!taskSnap.empty) await batch1.commit();
    // Delete related redemptions
    const redSnap = await famRef.collection('redemptions').where('userId','==',kidId).get();
    const batch2 = db.batch();
    redSnap.forEach(d => batch2.delete(d.ref));
    if(!redSnap.empty) await batch2.commit();
    // Remove from family members
    await famRef.update({ members: firebase.firestore.FieldValue.arrayRemove(kidId) });
    // Delete user doc
    await db.collection('users').doc(kidId).delete();
    cacheClear('family_'+userFamily.id);
    cacheSet('user_'+kidId, null);
    closeModal();
    showToast('已刪除小冒險家','green');
  } catch(e){ console.error('deleteKid error:', e); showToast('刪除失敗：'+e.message,'red'); }
}

function kidHome(){
  const coins = currentUser?.coins || 0;
  const petEXP = currentUser?.petEXP || 0;
  const streak = currentUser?.streak || 0;
  const ps = getPetStage(petEXP);
  const pPct = Math.min(100, Math.round(((petEXP - ps.minEXP) / (ps.maxEXP - ps.minEXP)) * 100));
  const todos = familyData.tasks.filter(t => taskIsFor(t,liffUserId) && t.status==='pending');
  const mySubmitted = familyData.tasks.filter(t => taskIsFor(t,liffUserId) && t.status==='submitted');
  const done = familyData.tasks.filter(t => taskIsFor(t,liffUserId) && t.status==='completed');
  const activeReminders = familyData.reminders.filter(r => r.isActive !== false);
  const nextAch = ACHIEVEMENTS.find(a => {
    if(a.type==='task_count') return done.length < a.threshold;
    if(a.type==='streak') return streak < a.threshold;
    if(a.type==='coins') return coins < a.threshold;
    if(a.type==='pet_level') return petEXP < a.threshold;
    return true;
  });

  // Today's done count
  const today = new Date(); today.setHours(0,0,0,0);
  const todayDone = done.filter(t => {
    const ts = t.completedAt?.seconds||t.createdAt?.seconds||0;
    return ts*1000 >= today.getTime();
  });

  // Tab badge counts
  const earned = ACHIEVEMENTS.filter(a => {
    if(a.type==='task_count') return done.length >= a.threshold;
    if(a.type==='streak') return streak >= a.threshold;
    if(a.type==='coins') return coins >= a.threshold;
    if(a.type==='pet_level') return petEXP >= a.threshold;
    return false;
  });
  const approvedTickets = familyData.redemptions.filter(r => r.userId===liffUserId && r.status==='approved');
  const pendingTickets = familyData.redemptions.filter(r => r.userId===liffUserId && r.status==='pending');
  const ticketBadge = (pendingTickets.length && approvedTickets.length)
    ? pendingTickets.length+'+'+approvedTickets.length
    : (pendingTickets.length+approvedTickets.length)||null;

  const tabsHtml = tabBar([
    {emoji:'🌟', label:'今日冒險', count:todos.length||null},
    {emoji:'🎫', label:'我的票券', count:ticketBadge},
    {emoji:'🏆', label:'我的成就', count:earned.length||null}
  ], kidHomeTab, 'switchKidHomeTab');

  if(kidHomeTab===1) return `<div>${tabsHtml}${kidRewardsTab()}</div>`;
  if(kidHomeTab===2) return `<div>${tabsHtml}${kidAchievementsTab()}</div>`;

  // Tab 0: 今日冒險
  const content = `<div class="tab-content space-y-4">
    ${(()=>{
      const rems = activeReminders.length > 0 ? activeReminders : [{emoji:'💪', message:'今天也要加油喔'}];
      const cur = rems[currentReminderIndex % rems.length] || rems[0];
      const dots = activeReminders.length > 1 ? `<div class="flex justify-center gap-1.5 mt-2">${rems.map((_,i) => `<span data-reminder-dot class="w-1.5 h-1.5 rounded-full transition-all duration-300 ${i===(currentReminderIndex%rems.length)?'bg-accent-blue':'bg-accent-blue/30'}"></span>`).join('')}</div>` : '';
      return `<div class="rounded-2xl p-4" style="background:rgba(59,130,246,.1);border:1px solid rgba(59,130,246,.25)">
      <div class="flex items-start gap-3">
        <span id="reminderEmoji" class="text-2xl shrink-0 transition-opacity duration-300">${cur.emoji||'💡'}</span>
        <div class="flex-1 min-w-0">
          <p class="text-[10px] text-accent-blue font-bold mb-1 uppercase tracking-widest">船長的話</p>
          <p id="reminderMsg" class="text-sm text-white leading-relaxed transition-opacity duration-300">${cur.message||''}</p>
        </div>
      </div>${dots}</div>`;
    })()}

    <div class="card p-4 blue-glow flex items-center gap-4">
      <div class="shrink-0 text-center">
        <div class="text-5xl mb-1 float">${ps.emoji}</div>
        <p class="text-[10px] font-bold text-indigo-400">${ps.name}</p>
      </div>
      <div class="flex-1 min-w-0">
        <p class="font-bold text-white mb-1">我的寵物夥伴</p>
        <div class="flex justify-between text-[10px] text-gray-500 mb-1">
          <span>寵物 EXP</span>
          <span>${petEXP} / ${ps.maxEXP}</span>
        </div>
        <div class="exp-bar mb-1.5"><div class="exp-fill" style="width:${pPct}%"></div></div>
        <div class="flex items-center gap-3 mt-2">
          ${streak>0?`<span class="text-xs text-orange-400 font-bold">🔥 ${streak} 天連續</span>`:''}
          <span class="text-xs text-accent-gold font-bold">🐚 ${coins}</span>
        </div>
      </div>
    </div>

    ${todayDone.length>0?`
    <div class="card p-3 flex items-center gap-3" style="border-color:rgba(16,185,129,.2)">
      <i class="ph-fill ph-check-circle text-accent-green text-lg shrink-0"></i>
      <p class="text-sm text-white flex-1">今天已完成 <b class="text-accent-green">${todayDone.length}</b> 個任務，賺了 <b class="text-accent-gold">${todayDone.reduce((s,t)=>s+(t.reward||0),0)}</b> 🐚</p>
    </div>`:''}

    <div>
      <div class="flex justify-between items-center mb-3">
        <p class="text-[11px] text-gray-500 font-bold uppercase tracking-widest">待完成任務（${todos.length}）</p>
        <button onclick="vibrate(5);switchPage('tasks')" class="text-xs text-accent-blue">全部 →</button>
      </div>
      ${todos.length>0?`
      <div class="space-y-3">${todos.slice(0,3).map(t => kidTaskCard(t)).join('')}</div>
      ${todos.length>3?`<p class="text-center text-xs text-gray-600 mt-2">還有 ${todos.length-3} 個任務…</p>`:''}`
      :done.length>0?`
      <div class="card p-4 flex items-center gap-3" style="border-color:rgba(16,185,129,.2)">
        <i class="ph-fill ph-check-circle text-accent-green text-2xl shrink-0"></i>

        <button onclick="vibrate(5);switchKidHomeTab(1)" class="bg-accent-gold text-dark-900 px-3 py-2 rounded-xl text-xs font-bold shrink-0">去看獎勵</button>
      </div>`:`
      <div class="card p-4 flex items-center gap-3">
        <i class="ph-fill ph-clock text-gray-500 text-2xl shrink-0"></i>
        <div><p class="font-semibold text-gray-400">等待船長派任務</p><p class="text-xs text-gray-600 mt-0.5">先看看有什麼獎勵吧</p></div>
      </div>`}
    </div>

    ${mySubmitted.length>0?`
    <div class="card p-3 flex items-center gap-3" style="border-color:rgba(245,158,11,.2)">
      <i class="ph-fill ph-clock text-accent-gold text-lg shrink-0"></i>
      <p class="text-sm text-gray-300 flex-1">${mySubmitted.length} 個任務等待船長審核中…</p>
    </div>`:''}

    ${nextAch?`
    <div class="card p-4 flex items-center gap-3 card-press" onclick="vibrate(5);switchKidHomeTab(2)" style="border-color:rgba(139,92,246,.2)">
      <div class="w-10 h-10 rounded-xl bg-accent-purple/10 flex items-center justify-center shrink-0"><i class="ph-fill ${nextAch.icon} text-accent-purple text-xl"></i></div>
      <div class="flex-1 min-w-0">
        <p class="text-[10px] text-accent-purple font-bold uppercase tracking-widest mb-0.5">下一個成就</p>
        <p class="font-semibold text-white">${nextAch.title}</p>
        <p class="text-xs text-gray-500">${nextAch.desc}</p>
      </div>
      <i class="ph ph-caret-right text-gray-600 shrink-0"></i>
    </div>`:''}
  </div>`;

  return `<div>${tabsHtml}${content}</div>`;
}

    ${todo.length>0?`<div>
      <p class="text-[11px] text-gray-500 font-bold uppercase tracking-widest mb-3">待完成（${todo.length}）</p>
      <div class="space-y-3">${todo.map(t => kidTaskCard(t)).join('')}</div>
    </div>`:''}

    ${submitted.length>0?`<div>
      <p class="text-[11px] text-gray-500 font-bold uppercase tracking-widest mb-3">審核中（${submitted.length}）</p>
      <div class="space-y-3">${submitted.map(t => `
        <div class="card p-4 flex items-center gap-3" style="border-color:rgba(245,158,11,.2)">
          <i class="ph-fill ph-clock text-accent-gold text-xl shrink-0"></i>
          <div class="flex-1"><p class="font-semibold text-white">${t.title}</p><p class="text-xs text-gray-500 mt-0.5">等待船長審核 · +${t.reward||0} 🐚</p></div>
        </div>`).join('')}
      </div>
    </div>`:''}

    ${done.length>0?`<div>
      <p class="text-[11px] text-gray-500 font-bold uppercase tracking-widest mb-3">已完成（${done.length}）</p>
      <div class="space-y-2 opacity-70">${done.map(t => `
        <div class="card p-4 flex items-center gap-3">
          <i class="ph-fill ph-check-circle text-accent-green text-xl shrink-0"></i>
          <div class="flex-1"><p class="text-sm font-semibold text-gray-400 line-through">${t.title}</p><p class="text-xs text-accent-green mt-0.5">+${t.reward||0} 🐚 已獲得</p></div>
        </div>`).join('')}
      </div>
    </div>`:''}

    ${todo.length===0&&submitted.length===0?empty('ph-trophy','太棒了！','所有任務都完成了！','去商城兌換',"vibrate(5);switchPage('store')"):''}
  </div>`;
}

// ══════════════════════════════════════
// Kid: Store
// ══════════════════════════════════════
function kidStore(){
  const coins = currentUser?.coins || 0;
  const allActive = familyData.rewards.filter(r => r.isActive !== false);
  const filtered = storeCat==='全部' ? allActive : allActive.filter(r => r.category===storeCat);
  // Sort
  const sorted = [...filtered].sort((a,b) => {
    if(storeSort==='cheap') return (a.cost||0) - (b.cost||0);
    if(storeSort==='newest') return (b.createdAt?.seconds||0) - (a.createdAt?.seconds||0);
    return 0; // popular — keep original
  });
  // Next affordable hint
  const cantAfford = allActive.filter(r => ((r.stock===undefined||r.stock<0) || (r.stock||0)>0) && coins < (r.cost||0)).sort((a,b)=>(a.cost||0)-(b.cost||0));
  const nextGoal = cantAfford[0];
  const STORE_CATS = ['全部','娛樂','美食','體驗','親子','特權'];
  const STORE_CAT_EMOJI = {'全部':'🏪','娛樂':'🎮','美食':'🍰','體驗':'🏖️','親子':'💝','特權':'🛡️'};

  return `<div class="space-y-4">
    <!-- 餘額 hero -->
    <div class="card p-5 gold-glow text-center" style="border-color:rgba(245,158,11,.2)">
      <p class="text-[10px] text-gray-500 font-bold uppercase tracking-widest mb-1">我的貝殼幣</p>
      <p class="text-5xl font-bold text-accent-gold mb-1">${coins}</p>
      ${nextGoal?`<p class="text-xs text-gray-500">再 <b class="text-accent-gold">${(nextGoal.cost||0)-coins}</b> 🐚 可換「${nextGoal.title}」</p>`
      :`<p class="text-xs text-accent-green">所有獎勵都換得起！</p>`}
    </div>

    <!-- 分類 pills -->
    <div class="flex gap-1.5 overflow-x-auto pb-1" style="-webkit-overflow-scrolling:touch;scrollbar-width:none;">
      ${STORE_CATS.map(c => `<button onclick="switchStoreCat('${c}')" class="shrink-0 px-3 py-1.5 rounded-full text-xs font-bold transition-all ${storeCat===c?'bg-accent-gold text-dark-900':'bg-dark-700 text-gray-400 hover:text-white'}">${STORE_CAT_EMOJI[c]||''} ${c}</button>`).join('')}
    </div>

    <!-- 排序 -->
    <div class="flex items-center gap-2">
      <p class="text-[10px] text-gray-600 mr-auto">${sorted.length} 個獎勵</p>
      ${[{k:'cheap',l:'最划算'},{k:'newest',l:'最新'},{k:'popular',l:'熱門'}].map(s =>
        `<button onclick="switchStoreSort('${s.k}')" class="text-[10px] font-bold px-2 py-1 rounded-lg transition-all ${storeSort===s.k?'bg-accent-gold/15 text-accent-gold':'text-gray-600 hover:text-gray-400'}">${s.l}</button>`
      ).join('')}
    </div>

    <!-- 獎勵卡片 -->
    ${sorted.length>0?`<div class="grid grid-cols-2 gap-3">${sorted.map(r => {
      const stk = r.stock===undefined ? -1 : (r.stock||0);
      const infinite = stk < 0;
      const soldOut = !infinite && stk <= 0;
      const ok = coins >= (r.cost||0) && !soldOut;
      const diff = (r.cost||0) - coins;
      const pct = Math.min(100, Math.round((coins / (r.cost||1)) * 100));
      // Kid-friendly stock text
      const stkText = soldOut ? '售完了 😢'
        : infinite ? '無限供應'
        : stk > 5 ? '還有很多'
        : stk >= 3 ? '還剩 '+stk+' 個'
        : '只剩 '+stk+' 個！';
      const stkColor = soldOut ? 'text-red-400'
        : infinite ? 'text-accent-blue'
        : stk > 5 ? 'text-accent-green'
        : stk >= 3 ? 'text-gray-300'
        : 'text-orange-400';
      // Rarity
      const cost = r.cost||0;
      const rarity = cost > 100 ? {label:'傳說',cls:'rarity-legend font-bold'} : cost > 60 ? {label:'珍稀',cls:'text-accent-purple'} : cost > 30 ? {label:'精選',cls:'text-accent-blue'} : {label:'日常',cls:'text-gray-500'};
      return `<div class="card p-4 flex flex-col items-center text-center relative ${soldOut?'opacity-50':''}">
        <span class="absolute top-2 right-2 text-[9px] font-bold ${rarity.cls}">${rarity.label}</span>
        ${soldOut?'<div class="absolute inset-0 flex items-center justify-center z-10 pointer-events-none"><span class="bg-red-500/90 text-white text-[10px] font-bold px-3 py-1 rounded-full -rotate-12">已售完</span></div>':''}
        <div class="text-5xl mb-1 ${ok?'float':''}">${r.emoji||'🎁'}</div>
        <p class="text-[10px] ${stkColor} mb-1">${stkText}</p>
        <p class="font-bold text-white text-sm mb-1 leading-tight">${r.title}</p>
        <p class="text-lg font-bold ${ok?'text-accent-gold':'text-gray-500'} mb-2">${cost} 🐚</p>
        ${soldOut?`<button disabled class="w-full bg-red-500/20 text-red-400 h-9 rounded-xl text-xs font-bold cursor-not-allowed">等待補貨</button>`
          :ok?`<button onclick="vibrate(10);redeemReward('${r.id}')" class="w-full bg-accent-gold text-dark-900 h-9 rounded-xl text-xs font-bold transition-all active:scale-90 hover:brightness-110">立即兌換</button>`
          :`<div class="w-full">
            <div class="w-full h-1.5 rounded-full bg-dark-700 mb-1.5"><div class="h-full rounded-full bg-accent-gold/40" style="width:${pct}%"></div></div>
            <p class="text-[10px] text-gray-600">還差 <b class="text-red-400">${diff}</b> 🐚</p>
          </div>`}
      </div>`;
    }).join('')}</div>`
    :empty('ph-storefront','這個分類還沒有獎勵','換個分類看看吧','')}
  </div>`;
}

// ══════════════════════════════════════
// Kid: History
// ══════════════════════════════════════
function kidHistory(){
  const done = familyData.tasks.filter(t => taskIsFor(t,liffUserId) && t.status==='completed');
  const myR = familyData.redemptions.filter(r => r.userId===liffUserId);
  const totalEarned = done.reduce((s,t) => s + (t.reward||0), 0);
  const totalSpent = myR.filter(r => r.status!=='rejected').reduce((s,r) => s + (r.cost||0), 0);
  const petEXP = currentUser?.petEXP || 0;
  const streak = currentUser?.streak || 0;
  const bestStreak = currentUser?.bestStreak || streak;
  const coins = currentUser?.coins || 0;

  const usedR = myR.filter(r => r.status==='used');
  const rejectedR = myR.filter(r => r.status==='rejected');
  const rewardHistBadge = usedR.length + rejectedR.length;

  const tabsHtml = tabBar([
    {emoji:'📊', label:'累積成就', count:null},
    {emoji:'🐱', label:'寵物成長', count:null},
    {emoji:'🎁', label:'獎勵歷程', count:rewardHistBadge||null},
    {emoji:'📅', label:'活動日記', count:null}
  ], kidHistoryTab, 'switchKidHistoryTab');

  // ─── Tab 0: 累積成就 ───
  if(kidHistoryTab===0){
    // 7-day comparison
    const now = new Date();
    const d7 = new Date(now); d7.setDate(d7.getDate()-7);
    const d14 = new Date(now); d14.setDate(d14.getDate()-14);
    const last7 = done.filter(t => { const ts=(t.completedAt?.seconds||0)*1000; return ts>=d7.getTime(); }).length;
    const prev7 = done.filter(t => { const ts=(t.completedAt?.seconds||0)*1000; return ts>=d14.getTime()&&ts<d7.getTime(); }).length;
    const pctChange = prev7>0 ? Math.round(((last7-prev7)/prev7)*100) : (last7>0?100:0);
    // This month coins
    const monthStart = new Date(now.getFullYear(), now.getMonth(), 1);
    const monthCoins = done.filter(t => { const ts=(t.completedAt?.seconds||0)*1000; return ts>=monthStart.getTime(); }).reduce((s,t)=>s+(t.reward||0),0);

    const achProgress = ACHIEVEMENTS.map(a => {
      let current = 0;
      if(a.type==='task_count') current = done.length;
      if(a.type==='streak') current = streak;
      if(a.type==='coins') current = coins;
      if(a.type==='pet_level') current = petEXP;
      const unlocked = current >= a.threshold;
      const pct = Math.min(100, Math.round((current/a.threshold)*100));
      return { ...a, current, unlocked, pct };
    });
    const earnedAch = achProgress.filter(a => a.unlocked);
    const lockedAch = achProgress.filter(a => !a.unlocked);

    return `<div>${tabsHtml}<div class="tab-content space-y-5">
      <!-- 統計卡片 -->
      <div class="grid grid-cols-2 gap-3">
        <div class="card p-3">
          <p class="text-[10px] text-gray-500 mb-1">完成任務</p>
          <p class="text-2xl font-bold text-accent-green">${done.length}</p>
          <p class="text-[10px] mt-1 ${pctChange>=0?'text-accent-green':'text-red-400'}">${pctChange>=0?'↑':'↓'} ${Math.abs(pctChange)}% 近 7 天</p>
        </div>
        <div class="card p-3">
          <p class="text-[10px] text-gray-500 mb-1">累積貝殼幣</p>
          <p class="text-2xl font-bold text-accent-gold">${totalEarned}</p>
          <p class="text-[10px] text-accent-gold mt-1">+${monthCoins} 本月</p>
        </div>
        <div class="card p-3">
          <p class="text-[10px] text-gray-500 mb-1">兌換獎勵</p>
          <p class="text-2xl font-bold text-accent-purple">${myR.filter(r=>r.status!=='rejected').length}</p>
          <p class="text-[10px] text-gray-600 mt-1">共花費 ${totalSpent} 🐚</p>
        </div>
        <div class="card p-3">
          <p class="text-[10px] text-gray-500 mb-1">連續打卡</p>
          <p class="text-2xl font-bold text-orange-400">${streak} 天</p>
          <p class="text-[10px] text-gray-600 mt-1">最佳 ${bestStreak} 天</p>
        </div>
      </div>

      <!-- 成就牆 -->
      <div>
        <p class="text-[11px] text-gray-500 font-bold uppercase tracking-widest mb-3">成就牆</p>
        ${earnedAch.length>0?`<div class="space-y-2 mb-4">${earnedAch.map(a => `
          <div class="card p-3 flex items-center gap-3" style="border-color:rgba(245,158,11,.25);background:linear-gradient(135deg,rgba(245,158,11,.05),transparent)">
            <div class="w-10 h-10 rounded-xl bg-accent-gold/15 flex items-center justify-center shrink-0"><i class="ph-fill ${a.icon} text-accent-gold text-xl"></i></div>
            <div class="flex-1 min-w-0">
              <p class="font-semibold text-white text-sm">${a.title} 🏅</p>
              <p class="text-[10px] text-gray-500">${a.desc}</p>
            </div>
            <span class="text-[10px] text-accent-gold font-bold shrink-0">已解鎖</span>
          </div>`).join('')}</div>`:''}
        ${lockedAch.length>0?`<div class="space-y-2">${lockedAch.map(a => `
          <div class="card p-3 flex items-center gap-3 opacity-60">
            <div class="w-10 h-10 rounded-xl bg-dark-700 flex items-center justify-center shrink-0"><i class="ph-fill ${a.icon} text-gray-600 text-xl"></i></div>
            <div class="flex-1 min-w-0">
              <p class="font-semibold text-gray-400 text-sm">${a.title}</p>
              <p class="text-[10px] text-gray-600">${a.desc}</p>
              <div class="flex items-center gap-2 mt-1">
                <div class="flex-1 h-1.5 rounded-full bg-dark-700"><div class="h-full rounded-full bg-accent-purple/60" style="width:${a.pct}%"></div></div>
                <span class="text-[9px] text-gray-600 shrink-0">${a.current}/${a.threshold}</span>
              </div>
            </div>
          </div>`).join('')}</div>`:''}
      </div>
    </div></div>`;
  }

  // ─── Tab 1: 寵物成長 ───
  if(kidHistoryTab===1){
    const ps = getPetStage(petEXP);
    const pPct = Math.min(100, Math.round(((petEXP - ps.minEXP) / (ps.maxEXP - ps.minEXP)) * 100));
    // Category breakdown for personality
    const catCounts = {};
    done.forEach(t => { if(t.category) catCounts[t.category] = (catCounts[t.category]||0)+1; });
    const topCats = Object.entries(catCounts).sort((a,b)=>b[1]-a[1]).slice(0,5);
    const maxCat = topCats[0]?topCats[0][1]:1;
    // Dominant personality
    const CAT_PERSONALITY = {學習:'學霸型',家事:'勤勞型',才藝:'藝術型',運動:'運動型',健康:'健康型'};
    const dominant = topCats[0] ? (CAT_PERSONALITY[topCats[0][0]]||topCats[0][0]+'達人') : '探索中';
    // Next stage hint
    const nextStage = PET_STAGES.find(s => s.minEXP > petEXP);

    return `<div>${tabsHtml}<div class="tab-content space-y-5">
      <!-- 當前寵物 -->
      <div class="card p-5 text-center blue-glow">
        <div class="text-6xl mb-2 float">${ps.emoji}</div>
        <p class="text-lg font-bold text-white mb-1">${ps.name}</p>
        <div class="flex justify-between text-[10px] text-gray-500 mb-1 max-w-[200px] mx-auto">
          <span>EXP ${petEXP}</span><span>${ps.maxEXP < 999999 ? ps.maxEXP : '∞'}</span>
        </div>
        <div class="exp-bar max-w-[200px] mx-auto mb-2"><div class="exp-fill" style="width:${pPct}%"></div></div>
        ${nextStage?`<p class="text-xs text-gray-500">再 <b class="text-accent-purple">${nextStage.minEXP - petEXP}</b> EXP 進化到 ${nextStage.emoji} ${nextStage.name}</p>`
        :`<p class="text-xs text-accent-gold">已達到最高等級！</p>`}
      </div>

      <!-- 進化時間軸 -->
      <div>
        <p class="text-[11px] text-gray-500 font-bold uppercase tracking-widest mb-3">進化歷程</p>
        <div class="relative pl-8">
          <div class="absolute left-3 top-2 bottom-2 w-0.5 bg-dark-600"></div>
          ${PET_STAGES.map((st,i) => {
            const reached = petEXP >= st.minEXP;
            const isCurrent = ps.name === st.name;
            return `<div class="relative mb-4 last:mb-0">
              <div class="absolute left-[-20px] top-1 w-3 h-3 rounded-full ${reached?'bg-accent-purple':'bg-dark-600'} ${isCurrent?'ring-2 ring-accent-purple/50':''}"></div>
              <div class="card p-3 flex items-center gap-3 ${!reached?'opacity-40':''}">
                <span class="text-2xl">${st.emoji}</span>
                <div class="flex-1">
                  <p class="font-semibold text-sm ${reached?'text-white':'text-gray-600'}">${st.name}</p>
                  <p class="text-[10px] text-gray-600">EXP ${st.minEXP}${st.maxEXP<999999?' → '+st.maxEXP:'+'}${isCurrent?' · 目前階段':''}</p>
                </div>
                ${reached&&!isCurrent?'<i class="ph-fill ph-check-circle text-accent-green shrink-0"></i>':''}
                ${isCurrent?'<span class="badge text-[9px] text-accent-purple bg-accent-purple/10">目前</span>':''}
              </div>
            </div>`;
          }).join('')}
        </div>
      </div>

      <!-- 個性發展 -->
      ${topCats.length>0?`<div>
        <p class="text-[11px] text-gray-500 font-bold uppercase tracking-widest mb-1">個性發展</p>
        <p class="text-xs text-accent-purple mb-3">主導個性：<b>${dominant}</b></p>
        <div class="space-y-2">${topCats.map(([cat,cnt]) => {
          const w = Math.round((cnt/maxCat)*100);
          const cc = CAT_COLORS[cat] || 'text-gray-400 bg-dark-700';
          return `<div>
            <div class="flex justify-between text-[10px] mb-0.5"><span class="text-gray-400">${cat}</span><span class="text-gray-600">${cnt} 次</span></div>
            <div class="h-2 rounded-full bg-dark-700"><div class="h-full rounded-full bg-accent-purple/60" style="width:${w}%"></div></div>
          </div>`;
        }).join('')}</div>
      </div>`:''}
    </div></div>`;
  }

  // ─── Tab 2: 獎勵歷程 ───
  if(kidHistoryTab===2){
    const used = usedR.sort((a,b)=>(b.usedAt?.seconds||b.appliedAt?.seconds||0)-(a.usedAt?.seconds||a.appliedAt?.seconds||0));
    const rejected = rejectedR.sort((a,b)=>(b.reviewedAt?.seconds||b.appliedAt?.seconds||0)-(a.reviewedAt?.seconds||a.appliedAt?.seconds||0));
    const allHist = [...used,...rejected];
    const showItems = rewardHistoryExpanded ? allHist : allHist.slice(0,10);
    // Stats
    const spentOnUsed = used.reduce((s,r)=>s+(r.cost||0),0);
    // Most redeemed reward
    const titleCounts = {};
    allHist.forEach(r => { const t=r.rewardTitle||'獎勵'; titleCounts[t]=(titleCounts[t]||0)+1; });
    const favReward = Object.entries(titleCounts).sort((a,b)=>b[1]-a[1])[0];
    // Most redeemed category (from reward data)
    const catCountsR = {};
    allHist.forEach(r => { if(r.rewardCategory) catCountsR[r.rewardCategory]=(catCountsR[r.rewardCategory]||0)+1; });
    const topCatR = Object.entries(catCountsR).sort((a,b)=>b[1]-a[1])[0];

    return `<div>${tabsHtml}<div class="tab-content space-y-5">
      <!-- 統計 -->
      <div class="grid grid-cols-2 gap-3">
        <div class="card p-3">
          <p class="text-[10px] text-gray-500 mb-1">已使用獎勵</p>
          <p class="text-2xl font-bold text-accent-green">${used.length}</p>
        </div>
        <div class="card p-3">
          <p class="text-[10px] text-gray-500 mb-1">累積花費</p>
          <p class="text-2xl font-bold text-accent-gold">${spentOnUsed} 🐚</p>
        </div>
        <div class="card p-3">
          <p class="text-[10px] text-gray-500 mb-1">最愛獎勵</p>
          <p class="text-sm font-bold text-white truncate">${favReward?favReward[0]:'—'}</p>
          ${favReward?`<p class="text-[10px] text-gray-600">兌換 ${favReward[1]} 次</p>`:''}
        </div>
        <div class="card p-3">
          <p class="text-[10px] text-gray-500 mb-1">常換類別</p>
          <p class="text-sm font-bold text-white">${topCatR?topCatR[0]:'—'}</p>
          ${topCatR?`<p class="text-[10px] text-gray-600">${topCatR[1]} 次</p>`:''}
        </div>
      </div>

      <!-- 已使用 -->
      ${used.length>0?`<div>
        <p class="text-[11px] text-gray-500 font-bold uppercase tracking-widest mb-3"><i class="ph ph-check-circle text-accent-green mr-1"></i>已使用（${used.length}）</p>
        <div class="space-y-2">${(rewardHistoryExpanded?used:used.slice(0,10)).map(r => {
          const ago = r.usedAt ? timeAgo(r.usedAt) : (r.appliedAt ? timeAgo(r.appliedAt) : '');
          return `<div class="card p-3 flex items-center gap-3">
            <div class="w-10 h-10 rounded-xl bg-accent-green/10 flex items-center justify-center shrink-0">
              ${r.rewardEmoji?'<span class="text-xl">'+r.rewardEmoji+'</span>':'<i class="ph-fill ph-check-circle text-accent-green text-xl"></i>'}
            </div>
            <div class="flex-1 min-w-0">
              <p class="text-sm font-semibold text-white truncate">${r.rewardTitle||'獎勵'}</p>
              <p class="text-[10px] text-gray-600">於 ${ago||'不久前'}使用 · ${r.cost||0} 🐚</p>
            </div>
            <span class="badge text-[9px] text-accent-green bg-accent-green/10">已使用 ✓</span>
          </div>`;
        }).join('')}</div>
      </div>`:''}

      <!-- 已駁回 -->
      ${rejected.length>0?`<div>
        <p class="text-[11px] text-gray-500 font-bold uppercase tracking-widest mb-3"><i class="ph ph-x-circle text-gray-500 mr-1"></i>已駁回（${rejected.length}）</p>
        <div class="space-y-2">${(rewardHistoryExpanded?rejected:rejected.slice(0,5)).map(r => {
          const ago = r.reviewedAt ? timeAgo(r.reviewedAt) : (r.appliedAt ? timeAgo(r.appliedAt) : '');
          return `<div class="card p-3 flex items-center gap-3 opacity-70">
            <div class="w-10 h-10 rounded-xl bg-dark-700 flex items-center justify-center shrink-0">
              ${r.rewardEmoji?'<span class="text-xl">'+r.rewardEmoji+'</span>':'<i class="ph-fill ph-x-circle text-gray-500 text-xl"></i>'}
            </div>
            <div class="flex-1 min-w-0">
              <p class="text-sm font-semibold text-gray-400 truncate">${r.rewardTitle||'獎勵'}</p>
              <p class="text-[10px] text-gray-600">於 ${ago||'不久前'}駁回 · ${r.cost||0} 🐚 已退還</p>
            </div>
            <span class="badge text-[9px] text-gray-500 bg-dark-700">已駁回 ✗</span>
          </div>`;
        }).join('')}</div>
        <div class="card p-3 mt-2 flex items-center gap-2" style="border-color:rgba(139,92,246,.15);background:linear-gradient(135deg,rgba(139,92,246,.04),transparent)">
          <span class="text-lg shrink-0">💪</span>
          <p class="text-xs text-gray-400">沒關係，繼續努力下次就成功！</p>
        </div>
      </div>`:''}

      ${allHist.length===0?empty('ph-gift','還沒有獎勵歷程','去商城兌換第一個獎勵吧','去商城',"vibrate(5);switchPage('store')"):''}

      ${!rewardHistoryExpanded&&allHist.length>10?`<button onclick="rewardHistoryExpanded=true;renderPage()" class="w-full card p-3 text-center text-sm text-accent-gold font-bold hover:bg-dark-700 transition-colors">載入更多（共 ${allHist.length} 筆）</button>`:''}
    </div></div>`;
  }

  // ─── Tab 3: 活動日記 ───
  const events = [
    ...done.map(t => ({type:'task', title:t.title, pts:'+' + (t.reward||0), emoji:'✅',
      ts:(t.completedAt?.seconds||t.createdAt?.seconds||0)*1000,
      desc:'完成任務', cat:t.category, color:'text-accent-green'})),
    ...myR.filter(r=>r.status!=='pending').map(r => ({type:'redeem', title:r.rewardTitle||'獎勵',
      pts:r.status==='rejected'?'+' + (r.cost||0):'-' + (r.cost||0),
      emoji:r.status==='used'?'🎫':r.status==='approved'?'🎁':r.status==='rejected'?'❌':'⏳',
      ts:(r.appliedAt?.seconds||0)*1000,
      desc:r.status==='used'?'使用票券':r.status==='approved'?'兌換核准':r.status==='rejected'?'兌換駁回・退幣':'兌換中',
      cat:'兌換', color:r.status==='rejected'?'text-red-400':'text-accent-gold'})),
  ].sort((a,b) => b.ts - a.ts);

  // Group by relative date
  function dateLabel(ts){
    const d = new Date(ts); const now = new Date();
    const diff = Math.floor((now.setHours(0,0,0,0) - new Date(d).setHours(0,0,0,0)) / 86400000);
    if(diff===0) return '今天';
    if(diff===1) return '昨天';
    if(diff<=3) return diff+'天前';
    if(diff<=7) return '一週內';
    return (d.getMonth()+1)+'/'+d.getDate();
  }
  const groups = {};
  events.forEach(e => { const lbl = dateLabel(e.ts); if(!groups[lbl]) groups[lbl]=[]; groups[lbl].push(e); });
  const groupKeys = Object.keys(groups);

  return `<div>${tabsHtml}<div class="tab-content space-y-4">
    ${groupKeys.length>0?groupKeys.map(lbl => `
      <div>
        <p class="text-[10px] text-gray-600 font-bold uppercase tracking-widest mb-2">${lbl}</p>
        <div class="space-y-1.5">${groups[lbl].map(e => {
          const t = new Date(e.ts);
          const timeStr = String(t.getHours()).padStart(2,'0')+':'+String(t.getMinutes()).padStart(2,'0');
          return `<div class="card p-3 flex items-center gap-3">
            <span class="text-[10px] text-gray-600 w-10 shrink-0 text-right">${timeStr}</span>
            <span class="text-lg shrink-0">${e.emoji}</span>
            <div class="flex-1 min-w-0">
              <p class="text-sm text-white truncate">${e.title}</p>
              <p class="text-[10px] text-gray-600">${e.desc}${e.cat&&e.cat!=='兌換'?' · '+e.cat:''}</p>
            </div>
            <span class="text-xs font-bold ${e.pts.startsWith('+')?'text-accent-green':'text-red-400'} shrink-0">${e.pts} 🐚</span>
          </div>`;
        }).join('')}</div>
      </div>`).join('')
    :empty('ph-calendar-blank','還沒有任何活動','完成任務後這裡會記錄你的冒險日記','去看任務',"vibrate(5);switchPage('tasks')")}
    ${events.length >= 20 ? `<button onclick="vibrate(5);loadHistoryPage(false)" class="w-full mt-3 card p-3 text-center text-sm text-accent-blue font-bold hover:bg-dark-700 transition-colors">載入更多…</button>` : ''}
  </div></div>`;
}

async function addTask(){
  const title = document.getElementById('nTitle')?.value.trim();
  const category = document.getElementById('nCat')?.value;
  const reward = parseInt(document.getElementById('nPts')?.value) || 10;
  if(!title){ showToast('請輸入任務名稱','gold'); return; }

  const selectedKids = [...document.querySelectorAll('#nKidSelect .kid-chip.selected')].map(b => b.dataset.kid);
  if(selectedKids.length === 0){ showToast('請選擇至少一位小冒險家','gold'); return; }

  try {
    const batch = db.batch();
    const tasksRef = db.collection('families').doc(userFamily.id).collection('tasks');
    selectedKids.forEach(kidId => {
      const newRef = tasksRef.doc();
      batch.set(newRef, {
        title, category, reward, assignedTo: kidId, assignedBy: liffUserId,
        status: 'pending', petEXP: userFamily.settings?.petEXPPerTask || 5,
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      });
    });
    fsLog('writes', `addTask batch (${selectedKids.length} tasks)`);
    await batch.commit();
    document.getElementById('nTitle').value = '';
    document.querySelectorAll('#nKidSelect .kid-chip.selected').forEach(b => {
      b.classList.remove('selected','bg-accent-blue/20','border-accent-blue','text-accent-blue');
    });
    const msg = selectedKids.length > 1
      ? `已為 ${selectedKids.length} 位小冒險家新增任務！`
      : '任務已新增！';
    showToast('<i class="ph-fill ph-plus-circle mr-1"></i> ' + msg, 'blue');
  } catch(e){ console.error('新增任務失敗:', e); showToast('新增失敗','red'); }
}

async function approveTask(id){
  const t = familyData.tasks.find(t => t.id===id);
  if(!t) return;
  try {
    // [P4] 已使用 batch — 任務完成 + 加幣 + 加 EXP
    const batch = db.batch();
    const famRef = db.collection('families').doc(userFamily.id);
    batch.update(famRef.collection('tasks').doc(id), {
      status: 'completed', completedAt: firebase.firestore.FieldValue.serverTimestamp()
    });
    batch.update(db.collection('users').doc(t.assignedTo), {
      coins: firebase.firestore.FieldValue.increment(t.reward || 0),
      petEXP: firebase.firestore.FieldValue.increment(t.petEXP || 5),
      lastActiveAt: firebase.firestore.FieldValue.serverTimestamp()
    });
    fsLog('writes', 'approveTask batch (task+user)');
    await batch.commit();
    cacheClear('user_' + t.assignedTo); // [P2] 寫入後清除快取
    showToast('<i class="ph-fill ph-check-circle mr-1"></i> 核准！貝殼幣已發放 🐚','green');
  } catch(e){ console.error('核准任務失敗:', e); showToast('核准失敗','red'); }
}

async function redeemReward(rid){
  const r = familyData.rewards.find(r => r.id===rid);
  if(!r || (r.stock||0) <= 0){ showToast('此獎勵已售完','red'); return; }
  if((currentUser?.coins||0) < (r.cost||0)){ showToast('貝殼幣不足 🐚','red'); return; }
  try {
    // [P4] 已使用 batch — 兌換申請 + 扣幣 + 扣庫存
    const batch = db.batch();
    const famRef = db.collection('families').doc(userFamily.id);
    batch.set(famRef.collection('redemptions').doc(), {
      rewardId: rid, rewardTitle: r.title, rewardEmoji: r.emoji || '', cost: r.cost || 0,
      userId: liffUserId, status: 'pending',
      appliedAt: firebase.firestore.FieldValue.serverTimestamp()
    });
    batch.update(db.collection('users').doc(liffUserId), {
      coins: firebase.firestore.FieldValue.increment(-(r.cost||0))
    });
    batch.update(famRef.collection('rewards').doc(rid), {
      stock: firebase.firestore.FieldValue.increment(-1)
    });
    fsLog('writes', 'redeemReward batch (redemption+user+reward)');
    await batch.commit();
    cacheClear('user_' + liffUserId); // [P2]
    cacheClear('rewards_' + userFamily.id); // [P2]
    showToast('<i class="ph-fill ph-gift mr-1"></i> 兌換申請已送出！等待船長確認 🚀','blue');
  } catch(e){ console.error('兌換失敗:', e); showToast('兌換失敗','red'); }
}

async function rejectRedemption(id){
  const r = familyData.redemptions.find(r => r.id===id);
  if(!r) return;
  try {
    // [P4] 已使用 batch — 駁回 + 退幣 + 退庫存
    const batch = db.batch();
    const famRef = db.collection('families').doc(userFamily.id);
    batch.update(famRef.collection('redemptions').doc(id), {
      status: 'rejected', reviewedAt: firebase.firestore.FieldValue.serverTimestamp(), reviewedBy: liffUserId
    });
    batch.update(db.collection('users').doc(r.userId), {
      coins: firebase.firestore.FieldValue.increment(r.cost || 0)
    });
    if(r.rewardId){
      batch.update(famRef.collection('rewards').doc(r.rewardId), {
        stock: firebase.firestore.FieldValue.increment(1)
      });
    }
    fsLog('writes', 'rejectRedemption batch');
    await batch.commit();
    cacheClear('user_' + r.userId); // [P2]
    cacheClear('rewards_' + userFamily.id); // [P2]
    showToast('<i class="ph ph-x-circle mr-1"></i> 已駁回並退還貝殼幣','red');
  } catch(e){ console.error('駁回兌換失敗:', e); showToast('駁回失敗','red'); }
}

    await db.collection('families').doc(userFamily.id).collection('rewards').doc(rid).delete();
    cacheClear('rewards_' + userFamily.id);
    showToast('<i class="ph ph-trash mr-1"></i> 獎勵已刪除','red');
  } catch(e){ console.error('刪除獎勵失敗:', e); showToast('刪除失敗','red'); }
}

async function addReward(){
  const title = document.getElementById('mrTitle')?.value.trim();
  const cost = parseInt(document.getElementById('mrCost')?.value) || 30;
  const stock = parseInt(document.getElementById('mrStock')?.value) || 5;
  const category = document.getElementById('mrCat')?.value;
  const emoji = document.getElementById('mrEmoji')?.value.trim() || '🎁';
  if(!title){ showToast('請輸入獎勵名稱','gold'); return; }
  try {
    fsLog('writes', 'addReward');
    await db.collection('families').doc(userFamily.id).collection('rewards').add({
      title, cost, stock, category, emoji, icon: 'ph-gift', isActive: true,
      createdAt: firebase.firestore.FieldValue.serverTimestamp(), createdBy: liffUserId
    });
    cacheClear('rewards_' + userFamily.id);
    closeModal(); showToast('<i class="ph-fill ph-gift mr-1"></i> 獎勵已新增！','green');
  } catch(e){ console.error('新增獎勵失敗:', e); showToast('新增失敗','red'); }
}

async function addReminder(){
  const message = document.getElementById('noticeText')?.value.trim();
  const emoji = document.getElementById('sEmoji')?.value || '💡';
  if(!message){ showToast('請輸入提醒內容','gold'); return; }
  const activeCount = familyData.reminders.filter(r => r.isActive!==false).length;
  if(activeCount>=10){ showToast('啟用中的提醒已達 10 條上限','gold'); return; }
  try {
    fsLog('writes', 'addReminder');
    await db.collection('families').doc(userFamily.id).collection('reminders').add({
      emoji, message, isActive: true,
      createdAt: firebase.firestore.FieldValue.serverTimestamp(), createdBy: liffUserId
    });
    showToast('<i class="ph-fill ph-bell-ringing mr-1"></i> 提醒已新增！','green');
    // clear form
    const tI=document.getElementById('noticeText'); if(tI) tI.value='';
    const pT=document.getElementById('pText'); if(pT) pT.textContent='輸入提醒內容…';
  } catch(e){ console.error('新增提醒失敗:', e); showToast('新增失敗','red'); }
}

async function deleteReminder(id){
  const r = familyData.reminders.find(r => r.id===id);
  if(r && !confirm(`確定要刪除「${r.message?.substring(0,15)||''}…」？`)) return;
  try {
    fsLog('writes', 'deleteReminder');
    await db.collection('families').doc(userFamily.id).collection('reminders').doc(id).delete();
    showToast('<i class="ph ph-trash mr-1"></i> 已刪除提醒','red');
  } catch(e){ console.error('刪除提醒失敗:', e); showToast('刪除失敗','red'); }
}

async function toggleReminder(id, newState){
  try {
    fsLog('writes', 'toggleReminder');
    if(newState && familyData.reminders.filter(r => r.isActive!==false && r.id!==id).length>=10){
      showToast('啟用中的提醒已達 10 條上限','gold'); return;
    }
    await db.collection('families').doc(userFamily.id).collection('reminders').doc(id).update({
      isActive: newState
    });
    showToast(newState?'<i class="ph ph-toggle-right mr-1"></i> 提醒已啟用':'<i class="ph ph-toggle-left mr-1"></i> 提醒已停用', newState?'green':'gold');
  } catch(e){ console.error('切換提醒失敗:', e); showToast('操作失敗','red'); }
}

function showEditReminderModal(id){
  const n = familyData.reminders.find(r => r.id===id);
  if(!n) return;
  const emojis = ['💡','❤️','⭐','🙏','😊','🎯','📚','🌈','💛','🎵','🦆','💬','🤝','🏃','🌸','🚀','🔥','🏆','🎨','🌟','🦷','🍳','🎒','☀️','🌧️','📖','✏️','🤔','😌','💪','🥰','🚴','💧','🥗','😴','🧘','👋','🤲','👫','💝','🛌','🌙','🤗'];
  const uniqueE = [...new Set(emojis)];
  showModal(`
    <h3 class="text-base font-bold text-white mb-4"><i class="ph ph-pencil-simple mr-1"></i>編輯提醒</h3>
    <div class="space-y-3">
      <div>
        <p class="text-xs text-gray-500 mb-2">選擇 Emoji</p>
        <div class="flex flex-wrap gap-1.5">
          ${uniqueE.map(e => `<button onclick="document.querySelectorAll('.eebtn').forEach(b=>b.classList.remove('ring-2','ring-accent-blue'));this.classList.add('ring-2','ring-accent-blue');document.getElementById('erEmoji').value='${e}';document.getElementById('erPreviewE').textContent='${e}'"
            class="eebtn w-8 h-8 rounded-lg bg-dark-700 flex items-center justify-center text-base transition-all active:scale-90 hover:bg-dark-600 ${e===(n.emoji||'💡')?'ring-2 ring-accent-blue':''}">${e}</button>`).join('')}
        </div>
        <input id="erEmoji" type="hidden" value="${n.emoji||'💡'}">
      </div>
      <div>
        <p class="text-xs text-gray-500 mb-2">提醒內容</p>
        <textarea id="erMsg" rows="2" class="w-full border rounded-xl px-4 py-3 text-sm resize-none"
          oninput="document.getElementById('erPreviewT').textContent=this.value||'…'">${n.message||''}</textarea>
      </div>
      <div class="rounded-xl p-3 flex items-center gap-3" style="background:rgba(59,130,246,.12);border:1px solid rgba(59,130,246,.25)">
        <span class="text-2xl shrink-0" id="erPreviewE">${n.emoji||'💡'}</span>
        <div>
          <p class="text-[10px] text-accent-blue font-bold mb-0.5">預覽</p>
          <p class="text-sm text-white" id="erPreviewT">${n.message||''}</p>
        </div>
      </div>
      <div class="flex gap-2">
        <button onclick="closeModal()" class="flex-1 bg-dark-700 text-gray-400 py-3 rounded-xl text-sm font-bold">取消</button>
        <button onclick="vibrate(8);editReminder('${id}')" class="flex-1 bg-accent-blue text-white py-3 rounded-xl text-sm font-bold transition-all active:scale-95"><i class="ph ph-check mr-1"></i>儲存</button>
      </div>
    </div>`, '480px');
}

async function editReminder(id){
  const msg = document.getElementById('erMsg')?.value.trim();
  const emoji = document.getElementById('erEmoji')?.value || '💡';
  if(!msg){ showToast('請輸入提醒內容','gold'); return; }
  try {
    fsLog('writes', 'editReminder');
    await db.collection('families').doc(userFamily.id).collection('reminders').doc(id).update({
      emoji, message: msg
    });
    closeModal(); showToast('<i class="ph-fill ph-check-circle mr-1"></i> 提醒已更新！','green');
  } catch(e){ console.error('編輯提醒失敗:', e); showToast('編輯失敗','red'); }
}

function copyInviteCode(){
  const code = userFamily?.inviteCode;
  if(!code) return;
  navigator.clipboard.writeText(code).then(() => {
    showToast('<i class="ph ph-check mr-1"></i> 邀請碼已複製！','green');
  }).catch(() => { showToast(`邀請碼: ${code}`,'blue'); });
}

function showLogoutConfirm(){
  const isCap = userRole === 'captain';
  showModal(`
    <div class="text-center">
      <div class="w-14 h-14 rounded-2xl ${isCap?'bg-accent-blue/10':'bg-accent-gold/10'} flex items-center justify-center mx-auto mb-3">
        <span class="text-3xl">${isCap?'👨‍✈️':'🧒'}</span>
      </div>
      <h3 class="text-lg font-bold mb-2">確定要${isCap?'登出':'離開冒險'}嗎？</h3>
      <p class="text-sm text-gray-400 mb-6">${isCap?'離開船長後台後，其他裝置仍可繼續使用。':'記得完成今天的任務再走喔！'}</p>
      <div class="flex gap-2">
        <button onclick="closeModal()" class="flex-1 card py-3 text-sm font-bold text-gray-400 hover:text-white transition-all">取消</button>
        <button onclick="closeModal();logout()" class="flex-1 bg-red-500 text-white py-3 rounded-xl text-sm font-bold transition-all active:scale-95 hover:brightness-110">${isCap?'👨‍✈️ 登出':'🧒 離開'}</button>
      </div>
    </div>`, '380px');
}

function logout(){
  const wasKidMode = new URLSearchParams(window.location.search).get('mode') === 'kid';
  clearPageListeners();
  coreListeners.forEach(fn => fn());
  coreListeners = [];
  familyData = { tasks:[], rewards:[], redemptions:[], reminders:[], members:{} };
  familyKids = [];
  currentUser = null; userFamily = null; userRole = null; liffUserId = null;
  historyLastDoc = null;
  // Clear kid session but keep rememberedKids
  sessionStorage.removeItem('currentKidCode');
  sessionStorage.removeItem('currentKidId');
  if(wasKidMode){
    window.location.href = 'kid.html';
    return;
  }
  document.getElementById('mainApp').classList.add('hidden');
  document.getElementById('loadingScreen').classList.remove('hidden');
  showDemoModeOption();
}
