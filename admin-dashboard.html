<head>

<script>
tailwind.config={theme:{extend:{
  fontFamily:{sans:['"Inter"','"Noto Sans TC"','sans-serif']},

    dark:{900:'#13141C',800:'#1C1E2A',700:'#2A2D3E',600:'#3F445E'},

<style>
/* ══ Default: Dark Theme ══ */
:root{
  --t-bg:#13141C;--t-bg2:#1C1E2A;--t-bg3:#2A2D3E;--t-bg4:#3F445E;
  --t-card:#1C1E2A;--t-text:#ffffff;--t-text2:#9CA3AF;--t-text3:#6B7280;
  --t-border:#2A2D3E;--t-border2:rgba(42,45,62,.5);
  --t-accent:#3B82F6;--t-accent-hover:rgba(59,130,246,.15);--t-accent-text:#60A5FA;
  --t-gold:#F59E0B;--t-green:#10B981;--t-red:#EF4444;--t-purple:#8B5CF6;--t-indigo:#6366F1;
  --t-stat-bg:linear-gradient(135deg,#1C1E2A 0%,#2A2D3E 100%);
  --t-stat-shadow:0 8px 24px rgba(0,0,0,.3);
  --t-header-bg:rgba(19,20,28,.9);
  --t-row-hover:rgba(42,45,62,.5);
  --t-font:'Inter','Noto Sans TC',sans-serif;
  --t-font-display:'Inter','Noto Sans TC',sans-serif;
  --t-badge-admin-bg:rgba(139,92,246,.15);--t-badge-admin-text:#A78BFA;
  --t-badge-blue-bg:rgba(59,130,246,.2);--t-badge-blue-text:#60A5FA;
  --t-badge-green-bg:rgba(16,185,129,.2);--t-badge-green-text:#34D399;
  --t-badge-red-bg:rgba(239,68,68,.2);--t-badge-red-text:#F87171;
  --t-badge-purple-bg:rgba(139,92,246,.2);--t-badge-purple-text:#A78BFA;
  --t-badge-mute-bg:#3F445E;--t-badge-mute-text:#9CA3AF;
  --t-login-btn-bg:#ffffff;--t-login-btn-text:#1f2937;--t-login-btn-border:#d1d5db;
  --t-select-bg:#2A2D3E;--t-select-border:#3F445E;--t-select-text:#D1D5DB;
}
/* ══ Michelin Warm Theme ══ */
[data-theme="michelin"]{
  --t-bg:#FAF7F2;--t-bg2:#F2EBE0;--t-bg3:#E8E0D4;--t-bg4:#D4C9BA;
  --t-card:#FFFFFF;--t-text:#2A2520;--t-text2:#6B5F52;--t-text3:#9A8F82;
  --t-border:rgba(42,37,32,.10);--t-border2:rgba(42,37,32,.06);
  --t-accent:#8B6F47;--t-accent-hover:rgba(139,111,71,.1);--t-accent-text:#6B5F52;
  --t-gold:#C99566;--t-green:#6B7F5C;--t-red:#C97D6F;--t-purple:#8B6F47;--t-indigo:#6B5F52;
  --t-stat-bg:#FFFFFF;
  --t-stat-shadow:0 20px 40px -20px rgba(139,111,71,.15);
  --t-header-bg:rgba(250,247,242,.92);
  --t-row-hover:rgba(242,235,224,.6);
  --t-font:'Plus Jakarta Sans','Noto Sans TC',sans-serif;
  --t-font-display:'Fraunces','Noto Serif TC',serif;
  --t-badge-admin-bg:rgba(139,111,71,.12);--t-badge-admin-text:#8B6F47;
  --t-badge-blue-bg:rgba(139,111,71,.1);--t-badge-blue-text:#6B5F52;
  --t-badge-green-bg:rgba(107,127,92,.12);--t-badge-green-text:#6B7F5C;
  --t-badge-red-bg:rgba(201,125,111,.12);--t-badge-red-text:#C97D6F;
  --t-badge-purple-bg:rgba(139,111,71,.1);--t-badge-purple-text:#8B6F47;
  --t-badge-mute-bg:rgba(42,37,32,.06);--t-badge-mute-text:#9A8F82;
  --t-login-btn-bg:#FFFFFF;--t-login-btn-text:#2A2520;--t-login-btn-border:rgba(42,37,32,.15);
  --t-select-bg:#FFFFFF;--t-select-border:rgba(42,37,32,.15);--t-select-text:#2A2520;
}
*{font-family:var(--t-font);-webkit-tap-highlight-color:transparent;}
body{background:var(--t-bg)!important;color:var(--t-text)!important;transition:background .3s,color .3s;}
::-webkit-scrollbar{width:3px;}
::-webkit-scrollbar-thumb{background:var(--t-bg3);border-radius:10px;}
.fade{animation:fadeUp .6s cubic-bezier(.2,.8,.2,1) both;}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.card{background:var(--t-card);border:1px solid var(--t-border);border-radius:16px;transition:background .3s,border-color .3s;}
.stat-card{background:var(--t-stat-bg);border:1px solid var(--t-border);border-radius:16px;transition:transform .2s cubic-bezier(.2,.8,.2,1),box-shadow .2s,background .3s;}
.stat-card:hover{transform:translateY(-2px);box-shadow:var(--t-stat-shadow);}
.table-row{transition:background .15s;}
.table-row:hover{background:var(--t-row-hover);}
.badge{display:inline-flex;align-items:center;padding:2px 10px;border-radius:9999px;font-size:12px;font-weight:500;}
.expand-content{max-height:0;overflow:hidden;transition:max-height .3s cubic-bezier(.2,.8,.2,1);}
.expand-content.open{max-height:500px;}
.tab-btn{padding:8px 20px;border-radius:9999px;font-size:14px;font-weight:500;transition:all .2s cubic-bezier(.2,.8,.2,1);}
.tab-btn.active{background:var(--t-accent);color:#fff;}
.tab-btn:not(.active){color:var(--t-text2);}
.tab-btn:not(.active):hover{background:var(--t-accent-hover);color:var(--t-accent-text);}
.pulse{animation:pulse 2s infinite;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
/* Michelin tab active needs white text override */
[data-theme="michelin"] .tab-btn.active{color:#FAF7F2;}
/* Header, loading, login text colors */
#loginScreen h1,#dashboard h1{color:var(--t-text);}
#loginScreen p,#loadingScreen p{color:var(--t-text2);}
#loginError{color:var(--t-red);}
/* Theme toggle button */
.theme-toggle{width:36px;height:36px;border-radius:8px;border:none;background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .2s;}
.theme-toggle:hover{background:var(--t-bg3);}
.theme-toggle svg{width:20px;height:20px;color:var(--t-text2);}
#activityList>div+div{border-top:1px solid var(--t-border);}
/* Michelin: Fraunces display font for key headings */
[data-theme="michelin"] h1,[data-theme="michelin"] h2{font-family:'Fraunces','Noto Serif TC',serif;}
/* Empty states */
#usersEmpty,#familiesEmpty,#activityEmpty{color:var(--t-text3);}
/* Loading screen */
#loadingScreen p{color:var(--t-text2);}
</style>
</head>

      <svg width="20" height="20" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>

          <h1 class="font-bold text-lg leading-tight" style="font-family:var(--t-font-display)">AdventureKids 管理員</h1>

      <div class="flex items-center space-x-2">
        <button onclick="toggleTheme()" class="theme-toggle" title="切換主題" id="themeToggleBtn">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" id="themeIcon"><path stroke-linecap="round" stroke-linejoin="round" d="M12 3v2.25m6.364.386l-1.591 1.591M21 12h-2.25m-.386 6.364l-1.591-1.591M12 18.75V21m-4.773-4.227l-1.591 1.591M5.25 12H3m4.227-4.773L5.636 5.636M15.75 12a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0z"/></svg>

<script>
// ══════════════════════════════════════
// Firebase Config
// ══════════════════════════════════════
const firebaseConfig = {
  apiKey: "AIzaSyC3JW1uql53R_fU4sqEct-5GacFr0NGVm0",
  authDomain: "family-grow-together.firebaseapp.com",
  projectId: "family-grow-together",
  storageBucket: "family-grow-together.firebasestorage.app",
  messagingSenderId: "1058037901780",
  appId: "1:1058037901780:web:bb35f0cfa4056e9ac776e8"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

const ADMIN_EMAIL = 'cs5252hh@gmail.com';

// ══════════════════════════════════════
// Firestore 讀寫統計
// ══════════════════════════════════════
const fsStats = { reads: 0, writes: 0, cacheHits: 0 };
function fsLog(type, desc='') {
  fsStats[type] = (fsStats[type] || 0) + 1;
  console.log(`[Firestore] ${type}: ${desc} | 累計 reads=${fsStats.reads} writes=${fsStats.writes} cacheHits=${fsStats.cacheHits}`);
}

// ══════════════════════════════════════
// localStorage 快取層
// ══════════════════════════════════════
const CACHE_TTL = 10 * 60 * 1000;
function cacheGet(key, maxAgeMs = CACHE_TTL) {
  try {
    const raw = localStorage.getItem('admin_' + key);
    if (!raw) return null;
    const { ts, data } = JSON.parse(raw);
    if (Date.now() - ts > maxAgeMs) { localStorage.removeItem('admin_' + key); return null; }
    fsLog('cacheHits', key);
    return data;
  } catch(e) { return null; }
}
function cacheSet(key, data) {
  try { localStorage.setItem('admin_' + key, JSON.stringify({ ts: Date.now(), data })); } catch(e) {}
}

// ══════════════════════════════════════
// State
// ══════════════════════════════════════
let allUsers = [];
let allFamilies = [];
let familySubData = {}; // { familyId: { tasks:[], rewards:[], redemptions:[] } }
let activityFeed = [];
let currentTab = 'users';
let tabDataLoaded = { users: false, families: false, activity: false };

// ══════════════════════════════════════
// Auth
// ══════════════════════════════════════
async function adminLogin() {
  try {
    const provider = new firebase.auth.GoogleAuthProvider();
    const result = await auth.signInWithPopup(provider);
    const email = result.user.email;
    if (email !== ADMIN_EMAIL) {
      await auth.signOut();
      showLoginError('此帳號未授權。僅限管理員登入。');
      return;
    }
    showScreen('loading');
    await loadAllData();
    showScreen('dashboard');
    document.getElementById('adminEmail').textContent = email;
  } catch (e) {
    if (e.code === 'auth/popup-closed-by-user') return;
    showLoginError('登入失敗：' + e.message);
  }
}

function adminLogout() {
  auth.signOut();
  allUsers = []; allFamilies = []; familySubData = {}; activityFeed = [];
  showScreen('login');
}

function showLoginError(msg) {
  const el = document.getElementById('loginError');
  el.textContent = msg;
  el.classList.remove('hidden');
}

function showScreen(name) {
  document.getElementById('loginScreen').classList.toggle('hidden', name !== 'login');
  document.getElementById('loadingScreen').classList.toggle('hidden', name !== 'loading');
  document.getElementById('dashboard').classList.toggle('hidden', name !== 'dashboard');
}

// ══════════════════════════════════════
// Data Loading（懶載入 + 快取）
// ══════════════════════════════════════
async function loadAllData() {
  // 只先載入 users + families（統計和用戶列表需要）
  const cachedUsers = cacheGet('allUsers');
  const cachedFamilies = cacheGet('allFamilies');

  if (cachedUsers && cachedFamilies) {
    allUsers = cachedUsers;
    allFamilies = cachedFamilies;
  } else {
    fsLog('reads', 'users collection');
    fsLog('reads', 'families collection');
    const [usersSnap, familiesSnap] = await Promise.all([
      db.collection('users').get(),
      db.collection('families').get()
    ]);
    allUsers = usersSnap.docs.map(d => ({ id: d.id, ...d.data() }));
    allFamilies = familiesSnap.docs.map(d => ({ id: d.id, ...d.data() }));
    cacheSet('allUsers', allUsers);
    cacheSet('allFamilies', allFamilies);
  }

  // 不載入子集合 — 等切到 families/activity tab 時再載入
  tabDataLoaded = { users: true, families: false, activity: false };

  renderStats();
  renderUsers();
}

// 延遲載入家庭子集合（僅在需要時）
async function loadFamilySubData() {
  if (Object.keys(familySubData).length > 0) return;
  familySubData = {};
  const subPromises = allFamilies.map(async (fam) => {
    fsLog('reads', `families/${fam.id}/tasks+rewards+redemptions`);
    const [tasksSnap, rewardsSnap, redemptionsSnap] = await Promise.all([
      db.collection('families').doc(fam.id).collection('tasks').get(),
      db.collection('families').doc(fam.id).collection('rewards').get(),
      db.collection('families').doc(fam.id).collection('redemptions').get()
    ]);
    familySubData[fam.id] = {
      tasks: tasksSnap.docs.map(d => ({ id: d.id, familyId: fam.id, ...d.data() })),
      rewards: rewardsSnap.docs.map(d => ({ id: d.id, ...d.data() })),
      redemptions: redemptionsSnap.docs.map(d => ({ id: d.id, familyId: fam.id, ...d.data() }))
    };
  });
  await Promise.all(subPromises);
}

async function refreshAll() {
  showScreen('loading');
  // 清除快取強制重新載入
  localStorage.removeItem('admin_allUsers');
  localStorage.removeItem('admin_allFamilies');
  familySubData = {};
  tabDataLoaded = { users: false, families: false, activity: false };
  await loadAllData();
  showScreen('dashboard');
}

// ══════════════════════════════════════
// Activity Feed Builder
// ══════════════════════════════════════
function buildActivityFeed() {
  activityFeed = [];

  // New user registrations
  allUsers.forEach(u => {
    if (u.createdAt) {
      activityFeed.push({
        type: 'register',
        icon: '👤',
        text: `${u.name || u.id} 註冊了帳號`,
        detail: isGoogle(u.id) ? 'Google' : 'LINE',
        time: toDate(u.createdAt)
      });
    }
  });

  // Completed tasks & submitted tasks
  Object.values(familySubData).forEach(fd => {
    fd.tasks.forEach(t => {
      if (t.completedAt) {
        activityFeed.push({
          type: 'task_complete',
          icon: '✅',
          text: `任務「${t.title}」已完成`,
          detail: `+${t.reward || 0} 貝殼幣`,
          time: toDate(t.completedAt)
        });
      }
      if (t.submittedAt) {
        activityFeed.push({
          type: 'task_submit',
          icon: '📋',
          text: `${t.assignedTo ? shortId(t.assignedTo) : '用戶'} 提交了「${t.title}」`,
          detail: '',
          time: toDate(t.submittedAt)
        });
      }
    });

    fd.redemptions.forEach(r => {
      if (r.appliedAt) {
        activityFeed.push({
          type: 'redeem',
          icon: '🎁',
          text: `兌換申請「${r.rewardTitle || '獎勵'}」`,
          detail: `${r.cost || 0} 貝殼幣`,
          time: toDate(r.appliedAt)
        });
      }
    });
  });

  // Sort by time descending, take latest 20
  activityFeed.sort((a, b) => (b.time || 0) - (a.time || 0));
  activityFeed = activityFeed.slice(0, 20);
}

// ══════════════════════════════════════
// Render: Stats
// ══════════════════════════════════════
function renderStats() {
  const totalUsers = allUsers.length;
  const lineUsers = allUsers.filter(u => !isGoogle(u.id)).length;
  const googleUsers = allUsers.filter(u => isGoogle(u.id)).length;
  const totalFamilies = allFamilies.length;

  const now = new Date();
  const todayStart = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const weekStart = new Date(todayStart);
  weekStart.setDate(weekStart.getDate() - 7);

  const activeToday = allUsers.filter(u => {
    const d = toDate(u.lastActiveAt);
    return d && d >= todayStart;
  }).length;

  const newThisWeek = allUsers.filter(u => {
    const d = toDate(u.createdAt);
    return d && d >= weekStart;
  }).length;

  const stats = [
    { label: '總用戶數', value: totalUsers, icon: 'ph-users', cv: '--t-accent' },
    { label: 'LINE 用戶', value: lineUsers, icon: 'ph-chat-circle', cv: '--t-green' },
    { label: 'Google 用戶', value: googleUsers, icon: 'ph-google-logo', cv: '--t-red' },
    { label: '總家庭數', value: totalFamilies, icon: 'ph-house', cv: '--t-purple' },
    { label: '今日活躍', value: activeToday, icon: 'ph-lightning', cv: '--t-gold' },
    { label: '本週新用戶', value: newThisWeek, icon: 'ph-user-plus', cv: '--t-indigo' }
  ];

  document.getElementById('statsGrid').innerHTML = stats.map(s => `
    <div class="stat-card p-4">
      <div class="flex items-center justify-between mb-2">
        <i class="ph ${s.icon} text-xl" style="color:var(${s.cv})"></i>
      </div>
      <div class="text-2xl" style="font-family:var(--t-font-display);font-weight:500;color:var(--t-text)">${s.value}</div>
      <div class="text-xs mt-1" style="color:var(--t-text3)">${s.label}</div>
    </div>
  `).join('');
}

// ══════════════════════════════════════
// Render: Users Table
// ══════════════════════════════════════
function renderUsers() {
  const loginFilter = document.getElementById('filterLoginType').value;
  const roleFilter = document.getElementById('filterRole').value;

  let filtered = allUsers.filter(u => {
    if (loginFilter === 'line' && isGoogle(u.id)) return false;
    if (loginFilter === 'google' && !isGoogle(u.id)) return false;
    if (roleFilter !== 'all' && u.role !== roleFilter) return false;
    return true;
  });

  // Sort by lastActiveAt desc
  filtered.sort((a, b) => (toDate(b.lastActiveAt) || 0) - (toDate(a.lastActiveAt) || 0));

  const tbody = document.getElementById('usersTableBody');
  const empty = document.getElementById('usersEmpty');

  if (filtered.length === 0) {
    tbody.innerHTML = '';
    empty.classList.remove('hidden');
    return;
  }
  empty.classList.add('hidden');

  // Build family name lookup
  const familyNames = {};
  allFamilies.forEach(f => { familyNames[f.id] = f.name || f.id; });

  tbody.innerHTML = filtered.map(u => {
    const loginType = isGoogle(u.id);
    const loginBadge = loginType
      ? `<span class="badge" style="background:var(--t-badge-red-bg);color:var(--t-badge-red-text)">Google</span>`
      : `<span class="badge" style="background:var(--t-badge-green-bg);color:var(--t-badge-green-text)">LINE</span>`;
    const roleBadge = u.role === 'captain'
      ? `<span class="badge" style="background:var(--t-badge-blue-bg);color:var(--t-badge-blue-text)">船長</span>`
      : `<span class="badge" style="background:var(--t-badge-purple-bg);color:var(--t-badge-purple-text)">小冒險家</span>`;
    const familyName = u.familyId ? (familyNames[u.familyId] || u.familyId) : '-';
    const lastActive = u.lastActiveAt ? formatTime(toDate(u.lastActiveAt)) : '-';

    return `<tr class="table-row" style="border-bottom:1px solid var(--t-border)">
      <td class="px-4 py-3">
        <div class="font-medium" style="color:var(--t-text)">${esc(u.name || '未命名')}</div>
        <div class="text-xs truncate max-w-[160px]" style="color:var(--t-text3)">${esc(shortId(u.id))}</div>
      </td>
      <td class="px-4 py-3">${roleBadge}</td>
      <td class="px-4 py-3">${loginBadge}</td>
      <td class="px-4 py-3 text-xs" style="color:var(--t-text2)">${esc(familyName)}</td>
      <td class="px-4 py-3 text-right" style="font-family:var(--t-font-display);color:var(--t-gold)">${u.coins || 0}</td>
      <td class="px-4 py-3 text-right" style="font-family:var(--t-font-display);color:var(--t-green)">${u.petEXP || 0}</td>
      <td class="px-4 py-3 text-xs" style="color:var(--t-text3)">${lastActive}</td>
    </tr>`;
  }).join('');
}

// ══════════════════════════════════════
// Render: Families
// ══════════════════════════════════════
function renderFamilies() {
  const container = document.getElementById('familiesList');
  const empty = document.getElementById('familiesEmpty');

  if (allFamilies.length === 0) {
    container.innerHTML = '';
    empty.classList.remove('hidden');
    return;
  }
  empty.classList.add('hidden');

  // Build user lookup
  const userMap = {};
  allUsers.forEach(u => { userMap[u.id] = u; });

  container.innerHTML = allFamilies.map(fam => {
    const sub = familySubData[fam.id] || { tasks: [], rewards: [], redemptions: [] };
    const memberCount = (fam.members || []).length;
    const taskCount = sub.tasks.length;
    const rewardCount = sub.rewards.length;
    const created = fam.createdAt ? formatTime(toDate(fam.createdAt)) : '-';

    const memberRows = (fam.members || []).map(mid => {
      const u = userMap[mid];
      if (!u) return `<div class="text-xs py-1" style="color:var(--t-text3)">${esc(shortId(mid))}（資料不存在）</div>`;
      const loginBadge = isGoogle(u.id)
        ? `<span class="badge text-[10px]" style="background:var(--t-badge-red-bg);color:var(--t-badge-red-text)">Google</span>`
        : `<span class="badge text-[10px]" style="background:var(--t-badge-green-bg);color:var(--t-badge-green-text)">LINE</span>`;
      const roleBadge = u.role === 'captain' ? '🚢' : '🧒';
      return `<div class="flex items-center justify-between py-1.5 text-sm">
        <div class="flex items-center space-x-2">
          <span>${roleBadge}</span>
          <span style="color:var(--t-text)">${esc(u.name || '未命名')}</span>
          ${loginBadge}
        </div>
        <div class="flex items-center space-x-3 text-xs" style="color:var(--t-text3)">
          <span>🐚 ${u.coins || 0}</span>
          <span>${u.petEXP || 0} EXP</span>
        </div>
      </div>`;
    }).join('');

    return `<div class="card overflow-hidden">
      <div class="p-4 cursor-pointer flex items-center justify-between" onclick="toggleExpand(this)">
        <div class="flex-1 min-w-0">
          <div class="flex items-center space-x-2">
            <span class="font-semibold" style="font-family:var(--t-font-display);color:var(--t-text)">${esc(fam.name || '未命名家庭')}</span>
            <span class="badge text-[10px]" style="background:var(--t-badge-mute-bg);color:var(--t-badge-mute-text)">${esc(fam.inviteCode || '-')}</span>
          </div>
          <div class="flex flex-wrap gap-3 mt-1.5 text-xs" style="color:var(--t-text3)">
            <span><i class="ph ph-users"></i> ${memberCount} 成員</span>
            <span><i class="ph ph-list-checks"></i> ${taskCount} 任務</span>
            <span><i class="ph ph-gift"></i> ${rewardCount} 獎勵</span>
            <span><i class="ph ph-clock"></i> ${created}</span>
          </div>
        </div>
        <i class="ph ph-caret-down text-lg transition-transform expand-arrow" style="color:var(--t-text3)"></i>
      </div>
      <div class="expand-content">
        <div class="px-4 pb-4 pt-1" style="border-top:1px solid var(--t-border)">
          <div class="text-xs mb-2 font-semibold" style="color:var(--t-text3)">成員詳情</div>
          ${memberRows || '<div class="text-xs" style="color:var(--t-text3)">無成員</div>'}
        </div>
      </div>
    </div>`;
  }).join('');
}

function toggleExpand(el) {
  const content = el.nextElementSibling;
  const arrow = el.querySelector('.expand-arrow');
  content.classList.toggle('open');
  arrow.style.transform = content.classList.contains('open') ? 'rotate(180deg)' : '';
}

// ══════════════════════════════════════
// Render: Activity Feed
// ══════════════════════════════════════
function renderActivity() {
  const container = document.getElementById('activityList');
  const empty = document.getElementById('activityEmpty');

  if (activityFeed.length === 0) {
    container.innerHTML = '';
    empty.classList.remove('hidden');
    return;
  }
  empty.classList.add('hidden');

  container.innerHTML = activityFeed.map(a => {
    const timeStr = a.time ? formatTime(a.time) : '-';
    return `<div class="flex items-center space-x-3 px-4 py-3">
      <span class="text-xl flex-shrink-0">${a.icon}</span>
      <div class="flex-1 min-w-0">
        <div class="text-sm" style="color:var(--t-text)">${esc(a.text)}</div>
        ${a.detail ? `<div class="text-xs" style="color:var(--t-text3)">${esc(a.detail)}</div>` : ''}
      </div>
      <div class="text-xs flex-shrink-0" style="color:var(--t-text3)">${timeStr}</div>
    </div>`;
  }).join('');
}

// ══════════════════════════════════════
// Tab Switching
// ══════════════════════════════════════
async function switchTab(tab) {
  currentTab = tab;
  ['users', 'families', 'activity'].forEach(t => {
    document.getElementById('tab-' + t).classList.toggle('hidden', t !== tab);
  });
  document.querySelectorAll('.tab-btn').forEach(btn => {
    const isActive = btn.textContent.includes(
      tab === 'users' ? '用戶' : tab === 'families' ? '家庭' : '即時'
    );
    btn.classList.toggle('active', isActive);
  });

  // 懶載入：只在切到該 tab 時才載入子集合
  if (tab === 'families' && !tabDataLoaded.families) {
    await loadFamilySubData();
    renderFamilies();
    tabDataLoaded.families = true;
  }
  if (tab === 'activity' && !tabDataLoaded.activity) {
    await loadFamilySubData(); // activity 需要子集合資料
    buildActivityFeed();
    renderActivity();
    tabDataLoaded.activity = true;
  }
}

// ══════════════════════════════════════
// Helpers
// ══════════════════════════════════════
function isGoogle(id) { return id && id.startsWith('google_'); }

function shortId(id) {
  if (!id) return '';
  if (id.startsWith('google_')) return 'G:' + id.slice(7, 15) + '...';
  if (id.length > 16) return id.slice(0, 12) + '...';
  return id;
}

function toDate(ts) {
  if (!ts) return null;
  if (ts.toDate) return ts.toDate();
  if (ts.seconds) return new Date(ts.seconds * 1000);
  if (ts instanceof Date) return ts;
  return new Date(ts);
}

function formatTime(d) {
  if (!d || isNaN(d)) return '-';
  const now = new Date();
  const diff = now - d;
  if (diff < 60000) return '剛剛';
  if (diff < 3600000) return Math.floor(diff / 60000) + ' 分鐘前';
  if (diff < 86400000) return Math.floor(diff / 3600000) + ' 小時前';
  if (diff < 604800000) return Math.floor(diff / 86400000) + ' 天前';
  return d.getFullYear() + '/' + (d.getMonth() + 1) + '/' + d.getDate();
}

function esc(s) {
  if (!s) return '';
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

// ══════════════════════════════════════
// Theme Toggle
// ══════════════════════════════════════
const SUN_SVG = '<path stroke-linecap="round" stroke-linejoin="round" d="M12 3v2.25m6.364.386l-1.591 1.591M21 12h-2.25m-.386 6.364l-1.591-1.591M12 18.75V21m-4.773-4.227l-1.591 1.591M5.25 12H3m4.227-4.773L5.636 5.636M15.75 12a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0z"/>';
const MOON_SVG = '<path stroke-linecap="round" stroke-linejoin="round" d="M21.752 15.002A9.718 9.718 0 0118 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 003 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 009.002-5.998z"/>';

function initTheme(){
  const saved = localStorage.getItem('admin_theme');
  if(saved === 'michelin'){
    document.documentElement.setAttribute('data-theme','michelin');
  }
  updateThemeIcon();
}

function toggleTheme(){
  const current = document.documentElement.getAttribute('data-theme');
  if(current === 'michelin'){
    document.documentElement.removeAttribute('data-theme');
    localStorage.setItem('admin_theme','dark');
  } else {
    document.documentElement.setAttribute('data-theme','michelin');
    localStorage.setItem('admin_theme','michelin');
  }
  updateThemeIcon();
}

function updateThemeIcon(){
  const isMichelin = document.documentElement.getAttribute('data-theme') === 'michelin';
  const svg = isMichelin ? MOON_SVG : SUN_SVG;
  ['themeIcon','floatingThemeIcon'].forEach(id => {
    const el = document.getElementById(id);
    if(el) el.innerHTML = svg;
  });
}

initTheme();

// ══════════════════════════════════════
// Init: check if already logged in
// ══════════════════════════════════════
auth.onAuthStateChanged(async (user) => {
  if (user && user.email === ADMIN_EMAIL) {
    showScreen('loading');
    await loadAllData();
    document.getElementById('adminEmail').textContent = user.email;
    showScreen('dashboard');
  } else if (user) {
    await auth.signOut();
    showScreen('login');
  }
});
