<script>
// ══════════════════════════════════════
// Firebase Config
// ══════════════════════════════════════
const firebaseConfig = {
  apiKey: "AIzaSyC3JW1uql53R_fU4sqEct-5GacFr0NGVm0",
  authDomain: "family-grow-together.firebaseapp.com",
  projectId: "family-grow-together",
  storageBucket: "family-grow-together.firebasestorage.app",
  messagingSenderId: "1058037901780",
  appId: "1:1058037901780:web:bb35f0cfa4056e9ac776e8"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

// ══════════════════════════════════════
// Constants & State
// ══════════════════════════════════════
const VALID_CHARS = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';
let currentKidDoc = null;  // The verified kid document from Firestore
let pinAttempts = 0;
let pinLockedUntil = 0;
let cameFromAvatars = false;  // Track if user navigated from avatar picker

// ══════════════════════════════════════
// Init
// ══════════════════════════════════════
document.addEventListener('DOMContentLoaded', () => {
  try {
    const remembered = JSON.parse(localStorage.getItem('rememberedKids') || '[]');
    if(remembered.length > 0){
      renderAvatarGrid(remembered);
      showPage('pageAvatarPicker');
    } else {
      showPage('pageCodeInput');
    }
  } catch(e){
    showPage('pageCodeInput');
  }
});

// ══════════════════════════════════════
// Page Navigation
// ══════════════════════════════════════
function showPage(pageId){
  ['pageAvatarPicker','pageCodeInput','pagePinInput','pageLoading'].forEach(id => {
    const el = document.getElementById(id);
    el.classList.add('hidden');
    el.classList.remove('fade-in');
  });
  const target = document.getElementById(pageId);
  target.classList.remove('hidden');
  void target.offsetWidth;
  target.classList.add('fade-in');

  // Show "back to avatars" button only if remembered kids exist
  const backBtn = document.getElementById('backToAvatarsBtn');
  if(backBtn){
    try {
      const remembered = JSON.parse(localStorage.getItem('rememberedKids') || '[]');
      backBtn.classList.toggle('hidden', remembered.length === 0);
    } catch(e){ backBtn.classList.add('hidden'); }
  }

  // Auto-focus first empty input
  if(pageId === 'pageCodeInput'){
    setTimeout(() => { const c1 = document.getElementById('c1'); if(c1) c1.focus(); }, 100);
  }
  if(pageId === 'pagePinInput'){
    setTimeout(() => { const p1 = document.getElementById('p1'); if(p1) p1.focus(); }, 100);
  }
}

// ══════════════════════════════════════
// Avatar Picker Page
// ══════════════════════════════════════
function renderAvatarGrid(kids){
  const grid = document.getElementById('avatarGrid');
  grid.innerHTML = kids.map((k, i) => `
    <button onclick="selectRememberedKid(${i})" class="card p-4 flex flex-col items-center gap-2 transition-all hover:translate-y-[-3px] hover:border-accent-gold/30 active:scale-95 cursor-pointer group">
      <span class="text-5xl group-hover:scale-110 transition-transform">${k.avatar||'🧒'}</span>
      <span class="text-sm font-bold text-white">${esc(k.name||'冒險家')}</span>
    </button>`).join('');
}

async function selectRememberedKid(index){
  try {
    const remembered = JSON.parse(localStorage.getItem('rememberedKids') || '[]');
    const kid = remembered[index];
    if(!kid || !kid.kidCode){ showToast('資料異常，請重新輸入代碼','red'); return; }

    // Verify with Firestore
    const snap = await db.collection('users').where('kidCode','==',kid.kidCode).where('role','==','kid').limit(1).get();
    if(snap.empty){
      // Kid no longer exists — remove from localStorage
      remembered.splice(index, 1);
      localStorage.setItem('rememberedKids', JSON.stringify(remembered));
      renderAvatarGrid(remembered);
      showToast('這個小冒險家已經不存在了','red');
      if(remembered.length === 0) showPage('pageCodeInput');
      return;
    }

    currentKidDoc = { id: snap.docs[0].id, ...snap.docs[0].data() };

    // Update localStorage with latest info
    remembered[index] = { kidCode: currentKidDoc.kidCode, name: currentKidDoc.name, avatar: currentKidDoc.avatar||'🧒', familyId: currentKidDoc.familyId, hasPin: currentKidDoc.hasPin||false };
    localStorage.setItem('rememberedKids', JSON.stringify(remembered));

    if(currentKidDoc.hasPin){
      cameFromAvatars = true;
      showPinPage(currentKidDoc);
      // Sync remember checkbox since they are already remembered
      const cb = document.getElementById('rememberMePin');
      if(cb) cb.checked = true;
    } else {
      loginSuccess(true);
    }
  } catch(e){
    console.error('selectRememberedKid error:', e);
    showToast('網路連線中斷，請稍後再試','red');
  }
}

function showManageDeviceModal(){
  try {
    const remembered = JSON.parse(localStorage.getItem('rememberedKids') || '[]');
    if(remembered.length === 0){ showToast('沒有記住的帳號','gold'); return; }
    showModal(`
      <h3 class="text-lg font-bold mb-4 text-center">管理這台裝置</h3>
      <p class="text-xs text-gray-500 mb-4 text-center">移除後需要重新輸入代碼登入</p>
      <div class="space-y-2 mb-4">
        ${remembered.map((k, i) => `
          <div class="flex items-center justify-between p-3 bg-dark-800 rounded-xl">
            <div class="flex items-center gap-3">
              <span class="text-2xl">${k.avatar||'🧒'}</span>
              <div>
                <p class="text-sm font-bold text-white">${esc(k.name||'冒險家')}</p>
                <p class="text-[10px] text-gray-500 font-mono">${k.kidCode||''}</p>
              </div>
            </div>
            <button onclick="removeRememberedKid(${i})" class="text-red-400 hover:text-red-300 text-xs font-bold px-3 py-1.5 rounded-lg bg-red-400/10 hover:bg-red-400/20 transition-all">移除</button>
          </div>`).join('')}
      </div>
      <button onclick="closeModal()" class="w-full card py-3 text-sm font-bold text-gray-400 hover:text-white transition-all">關閉</button>
    `, '400px');
  } catch(e){ showToast('讀取失敗','red'); }
}

function removeRememberedKid(index){
  try {
    const remembered = JSON.parse(localStorage.getItem('rememberedKids') || '[]');
    remembered.splice(index, 1);
    localStorage.setItem('rememberedKids', JSON.stringify(remembered));
    if(remembered.length > 0){
      renderAvatarGrid(remembered);
      showManageDeviceModal(); // Refresh modal
    } else {
      closeModal();
      showPage('pageCodeInput');
    }
    showToast('已移除','green');
  } catch(e){ showToast('移除失敗','red'); }
}

// ══════════════════════════════════════
// Code Input Page
// ══════════════════════════════════════
function codeInput(el, idx){
  // Filter invalid chars
  const v = el.value.toUpperCase();
  if(v && !VALID_CHARS.includes(v)){ el.value = ''; return; }
  el.value = v;
  if(v && idx < 6){
    const next = document.getElementById('c'+(idx+1));
    if(next) next.focus();
  }
  updateCodeButton();
}

function codeKeydown(e, idx){
  if(e.key === 'Backspace' && !e.target.value && idx > 1){
    const prev = document.getElementById('c'+(idx-1));
    if(prev){ prev.focus(); prev.value = ''; }
    updateCodeButton();
  }
}

function codePaste(e){
  e.preventDefault();
  let text = (e.clipboardData.getData('text') || '').toUpperCase().replace(/[^A-Z0-9]/g,'');
  // Strip KID- prefix if present
  if(text.startsWith('KID-')) text = text.slice(4);
  // Also strip if pasted full code without dash: KIDXXXXXX
  if(text.startsWith('KID') && text.length >= 9) text = text.slice(3);
  for(let i = 0; i < 6; i++){
    const inp = document.getElementById('c'+(i+1));
    if(inp){
      const ch = text[i] || '';
      inp.value = (ch && VALID_CHARS.includes(ch)) ? ch : '';
    }
  }
  updateCodeButton();
  // Focus last filled or next empty
  for(let i = 6; i >= 1; i--){
    const inp = document.getElementById('c'+i);
    if(inp && inp.value){ const next = document.getElementById('c'+(i+1)); if(next) next.focus(); else inp.focus(); break; }
  }
}

function updateCodeButton(){
  let full = true;
  for(let i = 1; i <= 6; i++){
    if(!(document.getElementById('c'+i)?.value)) { full = false; break; }
  }
  document.getElementById('codeNextBtn').disabled = !full;
}

function getCodeValue(){
  let code = 'KID-';
  for(let i = 1; i <= 6; i++) code += (document.getElementById('c'+i)?.value || '');
  return code;
}

async function verifyCode(){
  const code = getCodeValue();
  if(code.length !== 10){ showCodeError('請輸入完整 6 碼'); return; }
  hideCodeError();

  const btn = document.getElementById('codeNextBtn');
  btn.disabled = true; btn.textContent = '驗證中...';

  try {
    const snap = await db.collection('users').where('kidCode','==',code).where('role','==','kid').limit(1).get();
    if(snap.empty){
      showCodeError('找不到這個代碼，請再確認一次');
      btn.disabled = false; btn.textContent = '下一步';
      return;
    }
    currentKidDoc = { id: snap.docs[0].id, ...snap.docs[0].data() };
    btn.textContent = '下一步';
    updateCodeButton();

    if(currentKidDoc.hasPin){
      cameFromAvatars = false;
      showPinPage(currentKidDoc);
      // Sync remember checkbox
      const remCb = document.getElementById('rememberMe');
      const pinCb = document.getElementById('rememberMePin');
      if(pinCb && remCb) pinCb.checked = remCb.checked;
    } else {
      const remember = document.getElementById('rememberMe')?.checked || false;
      loginSuccess(remember);
    }
  } catch(e){
    console.error('verifyCode error:', e);
    showCodeError('網路連線中斷，請稍後再試');
    btn.disabled = false; btn.textContent = '下一步';
  }
}

function showCodeError(msg){
  const el = document.getElementById('codeError');
  el.textContent = msg; el.classList.remove('hidden');
}
function hideCodeError(){
  document.getElementById('codeError').classList.add('hidden');
}

// ══════════════════════════════════════
// PIN Input Page
// ══════════════════════════════════════
function showPinPage(kidDoc){
  document.getElementById('pinAvatar').textContent = kidDoc.avatar || '🧒';
  document.getElementById('pinName').textContent = kidDoc.name || '冒險家';
  // Clear PIN fields
  for(let i = 1; i <= 4; i++){
    const inp = document.getElementById('p'+i);
    if(inp){ inp.value = ''; inp.classList.remove('border-red-400'); inp.classList.add('border-dark-600'); }
  }
  document.getElementById('pinError').classList.add('hidden');
  pinAttempts = 0;
  showPage('pagePinInput');
}

function pinInput(el, idx){
  el.value = el.value.replace(/\D/g, '');
  if(el.value && idx < 4){
    const next = document.getElementById('p'+(idx+1));
    if(next) next.focus();
  }
  // Auto-verify when all 4 digits entered
  if(idx === 4 && el.value){
    const pin = getPinValue();
    if(pin.length === 4) verifyPin();
  }
}

function pinKeydown(e, idx){
  if(e.key === 'Backspace' && !e.target.value && idx > 1){
    const prev = document.getElementById('p'+(idx-1));
    if(prev){ prev.focus(); prev.value = ''; }
  }
}

function getPinValue(){
  let pin = '';
  for(let i = 1; i <= 4; i++) pin += (document.getElementById('p'+i)?.value || '');
  return pin;
}

function verifyPin(){
  const now = Date.now();
  if(now < pinLockedUntil){
    const secs = Math.ceil((pinLockedUntil - now) / 1000);
    showPinError('請稍後再試（' + secs + ' 秒）');
    clearPinFields();
    return;
  }

  const pin = getPinValue();
  if(!currentKidDoc || !currentKidDoc.pin){
    showPinError('系統錯誤，請重新輸入代碼');
    return;
  }

  if(pin === currentKidDoc.pin){
    // Success
    const remember = document.getElementById('rememberMePin')?.checked || false;
    loginSuccess(remember);
  } else {
    pinAttempts++;
    if(pinAttempts >= 5){
      pinLockedUntil = Date.now() + 30000;
      showPinError('請稍後再試，或請船長重設 PIN');
    } else {
      showPinError('PIN 不正確（剩餘 ' + (5 - pinAttempts) + ' 次）');
    }
    shakePinFields();
    clearPinFields();
  }
}

function showPinError(msg){
  const el = document.getElementById('pinError');
  el.textContent = msg; el.classList.remove('hidden');
}

function shakePinFields(){
  const container = document.getElementById('pinContainer');
  container.classList.add('shake');
  for(let i = 1; i <= 4; i++){
    const inp = document.getElementById('p'+i);
    if(inp){ inp.classList.remove('border-dark-600'); inp.classList.add('border-red-400'); }
  }
  setTimeout(() => {
    container.classList.remove('shake');
    for(let i = 1; i <= 4; i++){
      const inp = document.getElementById('p'+i);
      if(inp){ inp.classList.remove('border-red-400'); inp.classList.add('border-dark-600'); }
    }
  }, 600);
}

function clearPinFields(){
  for(let i = 1; i <= 4; i++){
    const inp = document.getElementById('p'+i);
    if(inp) inp.value = '';
  }
  setTimeout(() => { const p1 = document.getElementById('p1'); if(p1) p1.focus(); }, 100);
}

function backFromPin(){
  if(cameFromAvatars){
    showPage('pageAvatarPicker');
  } else {
    showPage('pageCodeInput');
  }
}

// ══════════════════════════════════════
// Login Success
// ══════════════════════════════════════
function loginSuccess(remember){
  if(!currentKidDoc) return;

  if(remember){
    try {
      const remembered = JSON.parse(localStorage.getItem('rememberedKids') || '[]');
      // De-duplicate by kidCode
      const existing = remembered.findIndex(k => k.kidCode === currentKidDoc.kidCode);
      const entry = { kidCode: currentKidDoc.kidCode, name: currentKidDoc.name, avatar: currentKidDoc.avatar||'🧒', familyId: currentKidDoc.familyId, hasPin: currentKidDoc.hasPin||false };
      if(existing >= 0) remembered[existing] = entry;
      else remembered.push(entry);
      localStorage.setItem('rememberedKids', JSON.stringify(remembered));
    } catch(e){ console.warn('localStorage save failed:', e); }
  }

  // Set session
  sessionStorage.setItem('currentKidCode', currentKidDoc.kidCode);
  sessionStorage.setItem('currentKidId', currentKidDoc.id);

  // Show loading then redirect
  showPage('pageLoading');
  setTimeout(() => {
    window.location.href = 'captain.html?mode=kid';
  }, 600);
}

// ══════════════════════════════════════
// Helpers
// ══════════════════════════════════════
function esc(s){ if(!s) return ''; return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
function showToast(msg, type){
  const bg = {blue:'bg-blue-500',green:'bg-emerald-500',gold:'bg-amber-500 text-dark-900',red:'bg-red-500'};
  const el = document.createElement('div');
  el.className = (bg[type]||bg.blue) + ' text-white px-4 py-3 rounded-2xl shadow-2xl text-sm font-semibold';
  el.style.animation = 'fadeIn 0.3s ease-out';
  el.innerHTML = msg;
  document.getElementById('toastBox').appendChild(el);
  setTimeout(() => { el.style.opacity = '0'; el.style.transition = 'opacity 0.3s'; setTimeout(() => el.remove(), 300); }, 3000);
}

function showModal(html, maxW){
  const box = document.getElementById('modalBox');
  box.innerHTML = html;
  box.style.maxWidth = maxW || '400px';
  const ov = document.getElementById('modalOv');
  ov.classList.remove('hidden'); ov.classList.add('flex');
}
function closeModal(){
  const ov = document.getElementById('modalOv');
  ov.classList.add('hidden'); ov.classList.remove('flex');
}
</script>
