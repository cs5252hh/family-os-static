<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>AdventureKids 冒險島</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+TC:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/@phosphor-icons/web"></script>
<script>
tailwind.config={theme:{extend:{
  fontFamily:{sans:['"Inter"','"Noto Sans TC"','sans-serif']},
  colors:{
    dark:{900:'#13141C',800:'#1C1E2A',700:'#2A2D3E',600:'#3F445E'},
    accent:{gold:'#F59E0B',green:'#10B981',blue:'#3B82F6',purple:'#8B5CF6',red:'#EF4444',indigo:'#6366F1'}
  }
}}}
</script>
<style>
*{font-family:'Inter','Noto Sans TC',sans-serif;-webkit-tap-highlight-color:transparent;}
body{background:#13141C;color:#fff;margin:0;min-height:100dvh;}
.card-press{transition:all .15s ease;}
.card-press:active{transform:scale(.97);}
</style>
</head>
<body class="flex items-center justify-center min-h-screen px-4">

<div class="w-full max-w-[480px] mx-auto py-12">

  <!-- Logo & Brand -->
  <div class="text-center mb-12">
    <img src="island-logo.png" alt="AdventureKids" style="width:128px;height:128px;" class="mb-4 mx-auto rounded-2xl shadow-lg shadow-accent-blue/10">
    <h1 class="text-2xl font-bold text-white tracking-tight mb-2">AdventureKids 冒險島</h1>
    <p class="text-sm text-gray-400">讓家務變冒險，讓教養變有趣</p>
  </div>

  <!-- Role Selection -->
  <div class="space-y-4 mb-10">

    <!-- Captain Button -->
    <button onclick="window.location.href='https://cs5252hh.github.io/family-os-static/captain.html'"
      class="w-full rounded-2xl p-5 flex items-center gap-4 cursor-pointer card-press transition-all duration-200 hover:scale-[1.03] active:scale-[0.97]"
      style="background:rgba(59,130,246,.1);border:1px solid rgba(59,130,246,.25)">
      <div class="w-14 h-14 rounded-2xl bg-accent-blue/15 flex items-center justify-center shrink-0">
        <span class="text-3xl">👨‍✈️</span>
      </div>
      <div class="text-left flex-1">
        <p class="text-lg font-bold text-white">我是船長</p>
        <p class="text-xs text-gray-400 mt-0.5">建立家庭、管理任務獎勵</p>
      </div>
      <i class="ph ph-arrow-right text-accent-blue text-xl shrink-0"></i>
    </button>

    <!-- Kid Button -->
    <button onclick="window.location.href='https://cs5252hh.github.io/family-os-static/kid.html'"
      class="w-full rounded-2xl p-5 flex items-center gap-4 cursor-pointer card-press transition-all duration-200 hover:scale-[1.03] active:scale-[0.97]"
      style="background:rgba(245,158,11,.08);border:1px solid rgba(245,158,11,.25)">
      <div class="w-14 h-14 rounded-2xl bg-accent-gold/15 flex items-center justify-center shrink-0">
        <span class="text-3xl">🧒</span>
      </div>
      <div class="text-left flex-1">
        <p class="text-lg font-bold text-white">我是小冒險家</p>
        <p class="text-xs text-gray-400 mt-0.5">輸入代碼開始冒險</p>
      </div>
      <i class="ph ph-arrow-right text-accent-gold text-xl shrink-0"></i>
    </button>

  </div>

  <!-- Hint -->
  <p class="text-center text-xs text-gray-600">第一次使用？從「我是船長」開始建立家庭</p>

</div>

</body>
</html>
