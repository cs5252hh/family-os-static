<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>AdventureKids 冒險島</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+TC:wght@300;400;500;600;700&family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Noto+Serif+TC:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://unpkg.com/@phosphor-icons/web"></script>
<script src="https://static.line-scdn.net/liff/edge/2.1/liff.js"></script>
<script>
tailwind.config={theme:{extend:{
  fontFamily:{sans:['"Inter"','"Noto Sans TC"','sans-serif']},
  colors:{
    dark:{900:'#13141C',800:'#1C1E2A',700:'#2A2D3E',600:'#3F445E'},
    accent:{gold:'#F59E0B',green:'#10B981',blue:'#3B82F6',purple:'#8B5CF6',red:'#EF4444',indigo:'#6366F1'}
  }
}}}
</script>
<style>
*{font-family:'Inter','Noto Sans TC',sans-serif;-webkit-tap-highlight-color:transparent;}
body{background:#13141C;color:#fff;margin:0;min-height:100dvh;transition:background .3s,color .3s;}
.card-press{transition:all .15s cubic-bezier(.2,.8,.2,1);}
.card-press:active{transform:scale(.97);}
[data-theme="michelin"] body{background:#FAF7F2!important;color:#2A2520!important;}
[data-theme="michelin"] *{font-family:'Plus Jakarta Sans','Noto Sans TC',sans-serif;}
[data-theme="michelin"] h1{font-family:'Fraunces','Noto Serif TC',serif!important;}
[data-theme="michelin"] .text-white{color:#2A2520!important;}
[data-theme="michelin"] .text-gray-400{color:#6B5F52!important;}
[data-theme="michelin"] .text-gray-600{color:#9A8F82!important;}
[data-theme="michelin"] .text-accent-blue{color:#8B6F47!important;}
[data-theme="michelin"] .text-accent-gold{color:#C99566!important;}
[data-theme="michelin"] .bg-accent-blue\/15{background:rgba(139,111,71,.12)!important;}
[data-theme="michelin"] .bg-accent-gold\/15{background:rgba(201,149,102,.12)!important;}
[data-theme="michelin"] a.card-press{background:rgba(139,111,71,.06)!important;border-color:rgba(139,111,71,.2)!important;}
[data-theme="michelin"] a.card-press:last-of-type{background:rgba(201,149,102,.06)!important;border-color:rgba(201,149,102,.2)!important;}
</style>
<script>(function(){var t=localStorage.getItem('app_theme');if(t==='michelin')document.documentElement.setAttribute('data-theme','michelin');})()</script>
</head>
<body class="flex items-center justify-center min-h-screen px-4">

<div class="w-full max-w-[480px] mx-auto py-12">

  <!-- Logo & Brand -->
  <div class="text-center mb-12">
    <img src="island-logo.png" alt="AdventureKids" style="width:128px;height:128px;" class="mb-4 mx-auto rounded-2xl shadow-lg shadow-accent-blue/10">
    <h1 class="text-2xl font-bold text-white tracking-tight mb-2">AdventureKids 冒險島</h1>
    <p class="text-sm text-gray-400">讓家務變冒險，讓教養變有趣</p>
  </div>

  <!-- Role Selection -->
  <div class="space-y-4 mb-10">

    <!-- Captain Button -->
    <a href="https://cs5252hh.github.io/family-os-static/captain.html"
      class="w-full rounded-2xl p-5 flex items-center gap-4 cursor-pointer card-press transition-all duration-200 hover:scale-[1.03] active:scale-[0.97] no-underline"
      style="background:rgba(59,130,246,.1);border:1px solid rgba(59,130,246,.25);text-decoration:none;display:flex;">
      <div class="w-14 h-14 rounded-2xl bg-accent-blue/15 flex items-center justify-center shrink-0">
        <span class="text-3xl">👨‍✈️</span>
      </div>
      <div class="text-left flex-1">
        <p class="text-lg font-bold text-white">我是船長</p>
        <p class="text-xs text-gray-400 mt-0.5">建立家庭、管理任務獎勵</p>
      </div>
      <i class="ph ph-arrow-right text-accent-blue text-xl shrink-0"></i>
    </a>

    <!-- Kid Button -->
    <a href="https://cs5252hh.github.io/family-os-static/kid.html"
      class="w-full rounded-2xl p-5 flex items-center gap-4 cursor-pointer card-press transition-all duration-200 hover:scale-[1.03] active:scale-[0.97] no-underline"
      style="background:rgba(245,158,11,.08);border:1px solid rgba(245,158,11,.25);text-decoration:none;display:flex;">
      <div class="w-14 h-14 rounded-2xl bg-accent-gold/15 flex items-center justify-center shrink-0">
        <span class="text-3xl">🧒</span>
      </div>
      <div class="text-left flex-1">
        <p class="text-lg font-bold text-white">我是小冒險家</p>
        <p class="text-xs text-gray-400 mt-0.5">輸入代碼開始冒險</p>
      </div>
      <i class="ph ph-arrow-right text-accent-gold text-xl shrink-0"></i>
    </a>

  </div>

  <!-- Hint -->
  <p class="text-center text-xs text-gray-600">第一次使用？從「我是船長」開始建立家庭</p>

</div>

<script>
// LIFF 登入完會跳回這裡（LIFF endpoint），偵測是否需要轉回 captain.html
(async function(){
  try {
    await liff.init({ liffId: '2009808286-3qfR7gLt' });
    if(liff.isLoggedIn()){
      const raw = localStorage.getItem('liffLoginReturn');
      localStorage.removeItem('liffLoginReturn');
      if(raw){
        try {
          const flag = JSON.parse(raw);
          // 只在 2 分鐘內設的 flag 才跳轉，防止舊 flag 干擾
          if(flag.to && flag.ts && (Date.now() - flag.ts < 120000)){
            window.location.href = flag.to === 'captain' ? 'captain.html' : flag.to + '.html';
          }
        } catch(e){
          // 舊格式的純字串 flag，忽略（過期）
        }
      }
    } else {
      localStorage.removeItem('liffLoginReturn');
    }
  } catch(e){
    console.warn('LIFF init on index:', e);
    localStorage.removeItem('liffLoginReturn');
  }
})();
</script>
</body>
</html>
